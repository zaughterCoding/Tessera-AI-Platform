<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E0 Big-Picture Overview</title>
<link rel="stylesheet" href="../lib/engine.css?v=6">
<style>
.nd{border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:8px 12px;font-size:13.5px;line-height:1.35;opacity:.35;transition:opacity .5s,border-color .5s,box-shadow .5s,background-color .5s}
.nd b{display:block;color:#fff;font-size:14.5px}
.nd small{color:var(--muted);font-size:11.5px}
.nd .ep{float:right;font-size:11px;padding:1px 7px;border-radius:9px;background:#2a5ca8;color:#fff;margin-left:6px}
.nd.on{opacity:1}
.nd.hot{opacity:1;border-color:var(--yellow);box-shadow:0 0 0 2px rgba(255,200,87,.35);background:#24294a}
.nd.redis{border-left:4px solid #ff8f8f}.nd.mysql{border-left:4px solid #7cc0ff}
#map{z-index:0}
#map path{fill:none;stroke:#56607e;stroke-width:2;transition:stroke .5s,opacity .5s}
#map path.on{stroke:#9fb2d8}
#map path.hot{stroke:var(--yellow);stroke-width:3}
.pipe{border-radius:12px;border:1px dashed #6b5fb3;background:rgba(181,140,255,.08);padding:8px 14px;opacity:.35;transition:opacity .5s}
.pipe.on{opacity:1}
.pipe .t{color:var(--purple);font-weight:700;font-size:14px;margin-bottom:6px}
.chip{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:6px;background:#2b2450;color:#e4dcff;margin:3px 4px 0 0;border:1px solid #4a3f86}
.cards{display:flex;gap:14px}
.cards .c{flex:1;background:#1b2440;border:1px solid #2e3a60;border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.6;color:#dfe6f5}
.cards .c h3{margin:0 0 6px;font-size:17px;color:var(--yellow)}
.eps{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;font-size:15px;line-height:1.5}
.eps div{background:#1b2440;border:1px solid #2e3a60;border-radius:10px;padding:8px 14px}
.eps b{color:var(--yellow);margin-right:8px}
</style>
</head>
<body>
<script src="../lib/engine.js?v=6"></script>
<script>
setEpisode({ alt: '../E0-全景总览.html', home: '../index.html?lang=en', title: 'E0 · Big-Picture Overview', docTitle: 'E0 Big-Picture Overview', example: "User 42's day: sign in → buy → pay → credits → generate", lanes: [['', ''], ['', ''], ['', '']], noLanes: true });

/* ============ Script ============ */
// Nodes: id, x, y, w, title, subtitle, episode, storage kind
const NODES = [
  ['login', 30, 120, 160, 'Sign in', 'Redis session · HttpOnly cookie', '', ''],
  ['browse', 220, 120, 170, 'Browse catalog', 'Five-layer catalog cache', 'E7', ''],
  ['buy', 430, 74, 200, 'Standard purchase', 'Sync path: MySQL only', 'E2', 'mysql'],
  ['seckill', 430, 168, 200, 'Flash sale', 'Sync: Redis only; async order', 'E3', 'redis'],
  ['order', 680, 120, 170, 'purchase_order', 'Both paths land in one table', '', 'mysql'],
  ['pay', 890, 120, 140, 'Payment', 'PAID + payment fact', 'E2', 'mysql'],
  ['grant', 1070, 120, 180, 'Credits granted', 'Two-hop outbox · ledger', 'E5', 'mysql'],
  ['close', 680, 270, 170, 'Expire / cancel', 'Same row lock', 'E2', 'mysql'],
  ['release', 430, 270, 200, 'Campaign stock return', 'MySQL first, Redis later', 'E3·E4', 'redis'],
  ['gen1', 1070, 236, 180, 'Submit generation', 'Freeze 1 credit', 'E6', 'mysql'],
  ['gen2', 1070, 326, 180, 'Fair dispatch → upstream', 'Short txns · leases', 'E6', 'mysql'],
  ['gen3', 1070, 416, 180, 'Save → settle', 'Consume or release, once', 'E6', 'mysql'],
];
// Edges: id, path
const EDGES = [
  ['e1', 'M190,150 L220,150'], ['e2', 'M390,150 L430,104'], ['e3', 'M390,150 L430,198'],
  ['e4', 'M630,104 L680,140'], ['e5', 'M630,198 L680,160'], ['e6', 'M850,150 L890,150'],
  ['e7', 'M1030,150 L1070,150'], ['e8', 'M765,180 L765,270'], ['e9', 'M680,300 L630,300'],
  ['e10', 'M1160,180 L1160,236'], ['e11', 'M1160,296 L1160,326'], ['e12', 'M1160,386 L1160,416'],
];
function drawMap() {
  put('map', '', `<svg width="1280" height="520" viewBox="0 0 1280 520">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#9fb2d8"/></marker></defs>
    ${EDGES.map(([id, d]) => `<path id="${id}" d="${d}" marker-end="url(#ah)"/>`).join('')}</svg>`, 0, 0, 1280, 520);
  NODES.forEach(([id, x, y, w, t, s, ep, kind]) =>
    put('n_' + id, 'nd ' + kind, `${ep ? `<span class="ep">${ep}</span>` : ''}<b>${t}</b><small>${s}</small>`, x, y, w));
}
function on(...ids) { ids.forEach(id => { const n = $('n_' + id); if (n) n.classList.add('on'); }); }
function hot(...ids) {
  stage.querySelectorAll('.nd.hot').forEach(n => n.classList.remove('hot'));
  ids.forEach(id => { const n = $('n_' + id); if (n) n.classList.add('on', 'hot'); });
}
function edge(cls, ...ids) { ids.forEach(id => { const e = $(id); if (e) { e.classList.remove('on', 'hot'); e.classList.add(cls); } }); }
function token(from, to, text = 'User 42') { fly(text, from, to, 'blue'); }
function pipe(chips, open = false) {
  put('pipe', 'pipe' + (open ? ' on' : ''), `<div class="t">business_outbox · the reliable pipe shared by every flow (E1)</div>` +
    chips.map(c => `<span class="chip">${c}</span>`).join(''), 30, 480, 1220, null);
}
const ALL_EVENTS = ['ORDER_CREATED', 'ORDER_EXPIRE', 'ORDER_PAID', 'ORDER_CLOSED', 'ENTITLEMENT_GRANT', 'CAMPAIGN_FULFILL', 'CAMPAIGN_STOCK_RELEASED', 'GENERATION_DISPATCH', 'PRODUCT_INVALIDATE', 'MEDIA_DELETE', 'CREATION_PUBLISH'];

scene('Intro', [
  step('This is the overview. The following episodes take each flow apart; this one first <em>stitches them into one map</em>: a whole day for user 42, from signing in to generating an image — which flows it passes through, where the data lands, and what connects them.',
    0, () => ov(`<div class="kp">Flow Animations · Episode 0</div><h1>Big-Picture Overview</h1><h2>One map showing how the five core flows connect end to end</h2>
      <ol><li>User 42's day: sign in → browse → buy → pay → credits → generate</li><li>Two ways to buy, one order table</li><li><b>outbox</b>: the reliable pipe every flow shares</li><li>The roles of MySQL, Redis and RocketMQ</li><li>Three things people most often mix up</li></ol>`)),
]);

scene("User 42's day", [
  step('First, the whole map. Nodes with a blue left border write only to MySQL; nodes with a red left border touch only Redis on their synchronous path. The badge in the corner names the episode that covers it. The purple dashed box at the bottom is the outbox — you will see it connects to almost every step.',
    0, () => { ovOff(); },
    300, () => { drawMap(); pipe([]); }),
  step('User 42 signs in: the token is a 64-hex random string stored in a Redis session and sent as an HttpOnly cookie. Then they browse the catalog, which reads through five cache layers (request scope → Caffeine → Memcache → Redis → MySQL).',
    0, () => { hot('login'); edge('hot', 'e1'); },
    600, () => token([60, 150], [240, 150]),
    1300, () => { hot('browse'); on('login'); edge('on', 'e1'); }),
  step('There are two ways to buy a credit pack. A <em>standard purchase</em> (E2) finishes in one MySQL transaction, with a request key plus a unique key against duplicates. A <em>flash sale</em> (E3) touches only Redis synchronously — an atomic Lua admission — and creates the order asynchronously via a Stream. Both <em>end up in the same order table</em>.',
    0, () => { hot('buy', 'seckill'); edge('hot', 'e2', 'e3'); },
    500, () => { token([300, 150], [450, 100]); },
    700, () => { token([300, 150], [450, 190], 'User 77'); },
    1500, () => { hot('order'); edge('on', 'e2', 'e3'); edge('hot', 'e4', 'e5'); },
    2200, () => edge('on', 'e4', 'e5')),
  step('Payment: the payment transaction writes only PAID, the payment fact and <code>ORDER_PAID</code> — <em>no credits are added there</em>. Credits travel through a two-hop outbox: ORDER_PAID registers a grant task, and ENTITLEMENT_GRANT actually creates the credit pack and its ledger entry (E5).',
    0, () => { hot('pay'); edge('hot', 'e6'); token([700, 150], [900, 150]); },
    1100, () => { hot('grant'); edge('on', 'e6'); edge('hot', 'e7'); pipe(['ORDER_PAID', 'ENTITLEMENT_GRANT'], true); },
    1900, () => edge('on', 'e7')),
  step('If the user never pays, the order is closed at its deadline via three paths: a delayed event, a 5-second scan, or user cancellation. Payment and closing rely on <em>the same row lock plus complementary time conditions</em>, so only one wins. When a flash-sale order closes, <em>the database returns the stock first</em> and Redis is topped up later by an event (E3); whether both sides agree is judged by reconciliation (E4).',
    0, () => { hot('close'); edge('hot', 'e8'); pipe(['ORDER_PAID', 'ENTITLEMENT_GRANT', 'ORDER_EXPIRE', 'ORDER_CLOSED'], true); },
    1100, () => { hot('release', 'close'); edge('hot', 'e9'); pipe(['ORDER_PAID', 'ENTITLEMENT_GRANT', 'ORDER_EXPIRE', 'ORDER_CLOSED', 'CAMPAIGN_STOCK_RELEASED'], true); },
    2200, () => edge('on', 'e8', 'e9')),
  step('With credits in hand, user 42 submits an image task: one transaction freezes 1 credit; the short scheduling transaction claims fairly by "in-flight ÷ weight" and calls upstream outside the transaction; after the result is saved the credit is <em>consumed</em>, on failure it is <em>released</em> — settled exactly once (E6).',
    0, () => { hot('gen1'); edge('hot', 'e10'); token([1150, 160], [1150, 250]); pipe(['ORDER_PAID', 'ENTITLEMENT_GRANT', 'ORDER_EXPIRE', 'ORDER_CLOSED', 'CAMPAIGN_STOCK_RELEASED', 'GENERATION_DISPATCH'], true); },
    1000, () => { hot('gen2'); edge('on', 'e10'); edge('hot', 'e11'); },
    1900, () => { hot('gen3'); edge('on', 'e11'); edge('hot', 'e12'); },
    2700, () => { edge('on', 'e12'); hot(); on(...NODES.map(n => n[0])); }),
]);

scene('The shared outbox', [
  step('Look back at the bottom: almost every "this transaction is done, and something else must reliably happen next" is handed over through <code>business_outbox</code>. It is written <em>in the same transaction</em> as the business change, a relay delivers it outside the transaction, and consumers de-duplicate with DONE and an inbox.',
    0, () => pipe(ALL_EVENTS, true),
    500, () => { ['n_buy', 'n_pay', 'n_close', 'n_gen1'].forEach((id, i) => { const n = $(id); if (n) later(i * 300, () => fly('INSERT outbox', [n.offsetLeft + 40, n.offsetTop + 30], [200 + i * 260, 500], '')); }); }),
  step('Remember the outbox semantics in one line: <em>at-least-once delivery + exactly-once effect</em>. Delivery may repeat (lease expiry, redrive, broker redelivery), so every consumer must be idempotent: lock and verify the outbox row in the database, de-duplicate via DONE / inbox, and make the projection itself idempotent on a business key.',
    0, () => note2('Four outbox keywords', `<ul><li><b>Same-txn write</b>: MANDATORY; roll back and it never existed</li><li><b>Claim</b>: RC + FOR UPDATE SKIP LOCKED + 30 s lease</li><li><b>Deliver</b>: outside the txn; exponential backoff, REVIEW when exhausted</li><li><b>Consume</b>: five steps in one txn, DONE + inbox de-dup</li></ul>`, 230, 30, 380)),
]);

scene('Storage roles', [
  step('Keep the three pieces of infrastructure apart: <em>MySQL is the source of truth</em> for orders, reservations, entitlements, tasks and the outbox; <em>Redis is an entry replica and a cache</em>, used only for flash-sale admission and the catalog cache; <em>RocketMQ is an optional transport</em> — the default is a local in-process call.',
    0, () => { clearNotes(); ov(`<div class="kp">What is the truth, what is a replica</div><div class="cards">
      <div class="c"><h3>MySQL · truth</h3>Orders, payments, reservations, credit packs and ledger, generation tasks, outbox. Every decision ends at a row lock or a conditional update.</div>
      <div class="c"><h3>Redis · entry replica</h3>Flash-sale admission (Lua + Stream), login sessions, catalog cache. If it breaks, close the entry and <b>rebuild a new generation</b> from the database.</div>
      <div class="c"><h3>RocketMQ · optional transport</h3>Just another way to deliver the outbox (<code>transport=rocketmq</code>). The default is <code>local</code>: the relay calls the consumer in-process.</div></div>`); }),
]);

scene('Three things not to mix up', [
  step('Finally, three things people most often mix up in interviews. One: <em>a standard purchase touches only MySQL synchronously; a flash sale touches only Redis</em>. Two: "taking over an unacknowledged message" — the flash-sale Stream uses <em>PEL + XCLAIM</em>, while the outbox uses <em>an expired SENDING lease that the claim SQL simply selects again</em>. Three: <em>Canal is only for cache invalidation</em>; it has nothing to do with stock, orders or outbox delivery.',
    0, () => ov(`<div class="kp">Three things not to mix up</div><div class="cards">
      <div class="c"><h3>① What the sync path touches</h3>Standard purchase: one MySQL transaction<br>Flash-sale admission: Redis only (Lua)<br>The order is written asynchronously by the Stream consumer</div>
      <div class="c"><h3>② Who takes over</h3>Stream: <b>PEL</b> idle 5 s → <b>XCLAIM</b><br>outbox: <b>SENDING</b> lease expires → the same claim SQL picks it<br>Two different mechanisms</div>
      <div class="c"><h3>③ Scope of Canal</h3>Only catalog <b>cache invalidation</b> (route B)<br>Not stock, orders or outbox<br>RocketMQ is not the default transport either</div></div>`)),
]);

scene('Viewing order', [
  step('Suggested order: watch E1 first to understand the shared pipe, then E2 to E6 following "buy → flash sale → rebuild → credits → generate", and finish with E7 on caching. Every episode ends with three pause-and-think questions for self-testing.',
    0, () => ov(`<div class="kp">Episode guide</div><div class="eps">
      <div><b>E1</b>Outbox: same-txn write, lease claims, five-step consume, SENT ≠ DONE</div>
      <div><b>E2</b>Standard purchase: request keys, snapshots, unknown outcomes, pay vs close</div>
      <div><b>E3</b>Flash sale: Lua admission, register / fulfill, XCLAIM, release on close</div>
      <div><b>E4</b>Rebuild &amp; reconcile: direction invariant, formula, entry guard, new generation</div>
      <div><b>E5</b>Entitlements: two-hop grant, trust the snapshot, identity, late grants, expiry</div>
      <div><b>E6</b>Generation: NOWAIT grants, fair picking, AIMD, terminal races, single settlement</div>
      <div><b>E7</b>Catalog cache: five layers, single-flight &amp; mutex, version invalidation, fallback, Canal</div>
      <div><b>Index</b><code>index.html</code> links to every episode in both languages</div></div>`)),
]);

function clearNotes() { ['note', 'note2'].forEach(gone); }

startPlayer();
</script>
</body>
</html>
