<script>
setEpisode({ alt: 'en/E1-reliable-outbox.html', home: 'index.html', title: 'E1 · 可靠消息 outbox', docTitle: 'E1 可靠消息 outbox', example: '例子：订单 1001 支付成功 → 事件 9004 ORDER_PAID',
  lanes: [['生产方 · 中继', '业务事务 / 实例 A、B'], ['传输 · 消费者', '投递 · 五步消费'], ['MySQL', 'outbox 与去重表']] });

/* ============ 剧本 ============ */
const TY = { outbox: 88, event: 254, inbox: 340, failure: 426 };
const toDB = t => [770, TY[t] + 4];
const MID = [600, 230];
const RA = [120, 250], RB = [120, 296], CG = [330, 140];
const ENV = id => `📨 ${id}`;

// 中栏清理：保留状态卡
function clearMid() { ['code', 'gate', 'note', 'note2'].forEach(gone); }
// 左栏：唤醒器与轮询
function trg(sched, line2) {
  put('trg', 'fe st trg', `<div class="lb">OutboxRelayTrigger（提交后唤醒）</div>
    <div class="row"><span>scheduled</span><b class="v">${sched}</b></div>
    <div class="lb" style="margin-top:4px">OutboxRelayScheduler（兜底轮询）</div>
    <div class="row"><span>${line2 || '每 1 秒：投递到期批次 + 重驱动'}</span></div>`, 26, 134, 248, null);
}
function relay(id, label, st, stText) { card(id, 26, id === 'A' ? 244 : 290, 248, label, st, stText, '实例 ' + id); }
function ob(id, kind, agg, state, next, extra = {}) {
  return Object.assign({ id, kind, aggregate_id: agg, state, att: '0/0', next_at: next, owner: '', lease: '', sent: '' }, extra);
}
// 一次可视化的状态变更
function obSet(id, kv) { for (const k in kv) cell('outbox', id, k, kv[k]); }

scene('片头', [
  step('这一集讲<em>可靠消息 outbox</em>。它是整个项目的公共管道：下单、支付、关单、发权益、活动建单、缓存失效，都靠它把“接下来要做的事”可靠地交出去。',
    0, () => ov(`<div class="kp">链路动画 · 第 1 集</div><h1>可靠消息 outbox</h1><h2>业务提交了，事件就一定会被处理；重复投递，效果也只生效一次</h2>
      <ol><li>双写问题：为什么不能直接发 MQ</li><li>同事务写入 + 提交后唤醒 + 每秒轮询</li><li>认领：<b>READ COMMITTED + FOR UPDATE SKIP LOCKED + 租约</b></li><li>消费五步：<b>锁库里的行逐字段核对</b>、inbox 去重、同事务提交</li><li>失败退避、REVIEW 隔离、租约接管、<b>SENT ≠ DONE</b></li></ol>`)),
  step('画面三栏：左边是写事件的业务事务和两个中继实例 A、B；中间是传输和消费者；右边是四张表：<code>business_outbox</code>、投影结果、去重用的 <code>message_inbox</code> 和失败记录 <code>message_failure</code>。',
    0, () => ovOff(),
    300, () => {
      clock('10:03:20.400');
      table('outbox', 722, TY.outbox, 532, 'business_outbox', '事件就是一行数据', [['id', 'id', 36], ['kind', 'kind', 128], ['state', 'state', 60], ['att', '发/消', 34], ['next_at', 'next_at', 54], ['owner', 'owner', 50], ['lease', 'lease', 54], ['sent', 'sent_at', 54]]);
      row('outbox', 9001, ob(9001, 'PRODUCT_INVALIDATE', 7, 'PENDING', '03:20.2'));
      row('outbox', 9002, ob(9002, 'ORDER_CREATED', 1003, 'PENDING', '03:20.4'));
      row('outbox', 9003, ob(9003, 'ORDER_EXPIRE', 1003, 'PENDING', '18:20.4'));
    },
    800, () => table('event', 722, TY.event, 532, 'purchase_order_event', '投影结果 · 主键 event_id', [['event_id', 'event_id', 70], ['order_id', 'order_id', 70], ['event_type', 'event_type', 110]]),
    1100, () => table('inbox', 722, TY.inbox, 532, 'message_inbox', '消费去重 · 主键 (consumer_group, event_id)', [['group', 'consumer_group', 150], ['event_id', 'event_id', 80]]),
    1400, () => table('failure', 722, TY.failure, 532, 'message_failure', '失败记录 · 主键 (consumer_group, event_key)', [['group', 'consumer_group', 104], ['key', 'event_key', 134], ['event_id', 'event_id', 64], ['reason', 'reason', 150]]),
    1900, () => note('读表提示', `<ul><li><b>发/消</b>：<code>attempts</code> / <code>consume_attempts</code>，发送失败次数和消费失败次数</li><li><b>next_at</b>：最早什么时候可以被认领</li><li><b>owner + lease</b>（lease_until）：谁认领了它、租约到什么时候</li><li>时间只显示“分:秒”，完整时间看右上角数据库时钟</li></ul>`, 182)),
]);

scene('① 双写问题', [
  step('先看为什么需要 outbox。支付事务改完订单、提交成功，接着要发 MQ 通知“订单已支付”。就在这两步之间，<em>进程崩溃了</em>：订单是 PAID，消息却永远没发出去，积分不会到账。',
    0, () => gone('note'),
    300, () => card('BIZ', 26, 88, 248, 'pay() · 订单 1001', 'run', '进行中', '业务'),
    1000, () => txs('BIZ', 'ok', '已提交'),
    1700, () => { fly('ORDER_PAID → MQ', [140, 110], [330, 100], 'red', { lost: true }); },
    2400, () => txs('BIZ', 'rb', '💥 进程崩溃'),
    2600, () => note('顺序一：先提交，再发 MQ', `提交成功 → <b>崩溃</b> → 消息没发<br>结果：业务成功了，下游永远不知道。<b>丢消息</b>。`, 182)),
  step('反过来，先发 MQ 再提交呢？消息已经发出去，提交却因为锁超时失败回滚了。下游收到一条“订单已支付”，可<em>数据库里这单根本没付</em>。两种顺序都不对，因为数据库和 MQ 没法放进同一个事务。',
    0, () => { card('BIZ', 26, 88, 248, 'pay() · 订单 1001', 'run', '进行中', '业务'); },
    600, () => fly('ORDER_PAID → MQ', [140, 110], [330, 100], 'blue'),
    1500, () => txs('BIZ', 'rb', '提交失败 · 回滚'),
    1900, () => note2('顺序二：先发 MQ，再提交', `消息已发 → 提交失败回滚<br>结果：下游处理了一件<b>不存在的事</b>。`, 290)),
  step('outbox 的思路：<em>不在事务里发消息，而是把“要发的消息”当成一行数据，和业务修改写进同一个事务</em>。提交了，这一行就一定在；回滚了，它就不存在。之后再由中继把这一行可靠地投递出去。',
    0, () => { clearMid(); gone('tx_BIZ'); },
    300, () => note('outbox：把消息变成业务表里的一行', `<ul><li>业务修改 + <code>INSERT business_outbox</code>：<b>同一个本地事务</b></li><li>中继在事务外读这些行、投递、记录结果</li><li>投递可能重复 → 消费端必须幂等</li></ul>一句话：<b>至少一次投递 + 恰好一次效果</b>`, 182)),
]);

scene('② 同事务写入', [
  step('支付事务里，改订单状态、写支付事实之后，再插入一行 <code>ORDER_PAID</code>，状态 <code>PENDING</code>，<code>next_attempt_at</code> 取数据库时间。这一行和订单修改<em>一起提交</em>。',
    0, () => { clearMid(); clock('10:03:20.503', true); card('BIZ', 26, 88, 248, 'pay() · 订单 1001', 'run', '进行中', '业务'); },
    400, () => code(`INSERT INTO business_outbox(kind, aggregate_id, user_id, state, next_attempt_at)\nVALUES ('ORDER_PAID', 1001, 42, 'PENDING', NOW(3))\n-- 延迟事件另走 insertEventAt：next_attempt_at = deliver_at`),
    1100, () => fly('INSERT', [200, 110], toDB('outbox'), 'blue'),
    1900, () => row('outbox', 9004, ob(9004, 'ORDER_PAID', 1001, 'PENDING', '03:20.5'), 'BIZ')),
  step('写事件的方法是 <code>@Transactional(propagation = MANDATORY)</code>：调用方<em>必须已经在事务里</em>，否则直接抛异常。这就从代码层面保证，不会有人在事务外单独写一条事件。',
    0, () => note('两种写入方式', `<ul><li><b>普通事件</b>：<code>INSERT</code>，每次业务动作一行（订单创建、支付、关单……）</li><li><b>由消费者登记的后续任务</b>：<code>INSERT IGNORE</code> + 唯一键 <code>idempotency_key</code>，如 <code>ENTITLEMENT_GRANT</code>、<code>CAMPAIGN_FULFILL</code>。同一件事重复登记，也只有一行</li></ul>`, 290)),
]);

scene('③ 唤醒与轮询', [
  step('事务提交后，<code>afterCommit</code> 回调调用 <code>wakeUp()</code>：用 <code>AtomicBoolean</code> 做一次 CAS，把 <code>scheduled</code> 从 false 改成 true，再往单线程执行器里放一个投递任务。<em>回滚时根本不会触发</em>。',
    0, () => { clearMid(); commit('BIZ'); txs('BIZ', 'ok', '已提交'); trg('false'); },
    700, () => { ping(140, 160); trg('true ← CAS 成功'); },
    1300, () => code(`if (!scheduled.compareAndSet(false, true)) return;  // 已有任务在排队\nexecutor.execute(() -> {\n  scheduled.set(false);\n  relay.relayOutboxBatch();\n});`)),
  step('这时又有两个事务紧接着提交，它们的 CAS 都失败，直接返回：<em>多次唤醒合并成一次</em>。反正一次投递会把所有到期事件一起认领，不需要每次提交都开一轮。',
    0, () => { ping(140, 160); tagAt('w2', '提交 → wakeUp() → CAS 失败，返回', 30, 250, ''); },
    700, () => { ping(140, 160); tagAt('w3', '提交 → wakeUp() → CAS 失败，返回', 30, 286, ''); },
    1500, () => { gone('w2'); gone('w3'); trg('false（任务已开始执行）'); }),
  step('唤醒只是为了<em>快</em>，正确性靠兜底轮询：每个实例每 1 秒跑一次，先投递到期批次（整批满了就继续，最多 10 批），再做 SENT 重驱动。唤醒失败、进程重启，最多晚 1 秒。注意：<em>这里没有 Canal</em>。',
    0, () => { gone('tx_BIZ'); note('两个触发源', `<ul><li><b>afterCommit 唤醒</b>：低延迟，多次合并成一次，失败只打日志</li><li><b>@Scheduled(fixedDelay = 1000)</b>：<code>relayDueBatches()</code> + <code>redriveUnconsumedEvents()</code></li><li>Canal 只用于目录缓存失效，和 outbox 投递无关</li></ul>`, 182); }),
]);

scene('④ 认领', [
  step('两个实例同时来抢：实例 B 的轮询刚好到点，实例 A 被唤醒。两边各开一个<em>很短的认领事务</em>，隔离级别是 <code>READ COMMITTED</code>。为了画面清楚，这里每批只取 2 条（默认 50）。',
    0, () => { clearMid(); gone('tx_BIZ'); clock('10:03:20.505', true); trg('false'); },
    400, () => { relay('B', '轮询 · 认领事务', 'run'); },
    800, () => { relay('A', '唤醒 · 认领事务', 'run'); },
    1300, () => code(`(SELECT * FROM business_outbox\n WHERE state = 'SENDING' AND lease_until < NOW(3)   -- ① 租约过期\n ORDER BY lease_until, id LIMIT 2 FOR UPDATE SKIP LOCKED)\nUNION ALL\n(SELECT * FROM business_outbox\n WHERE state = 'PENDING' AND next_attempt_at <= NOW(3)  -- ② 到期待发\n ORDER BY next_attempt_at, id LIMIT 2 FOR UPDATE SKIP LOCKED)\nLIMIT 2`, 182)),
  step('B 先执行，锁住最早到期的 9001、9002。A 紧跟着执行：<code>SKIP LOCKED</code> 让它<em>跳过 B 已经锁住的行</em>，不排队，直接拿到 9004。9003 是 15 分钟后才到期的关单事件，两边都不会选。',
    0, () => { hl('outbox', 9001); hl('outbox', 9002); },
    500, () => { lock('outbox', 9001, 'X', 'B'); lock('outbox', 9002, 'X', 'B'); },
    1300, () => { hl('outbox', 9001, null); hl('outbox', 9002, null); hl('outbox', 9004); },
    1700, () => lock('outbox', 9004, 'X', 'A'),
    2300, () => { hl('outbox', 9004, null); dim('outbox', 9003); }),
  step('拿到行锁后，逐条执行 <code>claimEvent</code>：改成 <code>SENDING</code>，写入本批的 owner（每批一个新 UUID）和 30 秒租约。WHERE 里把认领条件再查一遍，然后<em>立刻提交</em>，锁随之释放，认领事务里不做任何网络调用。',
    0, () => code(`UPDATE business_outbox\nSET state = 'SENDING', lease_owner = ?,\n    lease_until = DATE_ADD(NOW(3), INTERVAL 30 SECOND)\nWHERE id = ? AND ((state = 'PENDING' AND next_attempt_at <= NOW(3))\n              OR (state = 'SENDING' AND lease_until < NOW(3)))`, 182),
    900, () => { obSet(9001, { state: 'SENDING', owner: 'B·91d2', lease: '03:50.5' }); obSet(9002, { state: 'SENDING', owner: 'B·91d2', lease: '03:50.5' }); },
    1400, () => obSet(9004, { state: 'SENDING', owner: 'A·7f3c', lease: '03:50.5' }),
    2100, () => { unlock('A'); unlock('B'); relay('A', '本批 9004', 'run', '投递中'); relay('B', '9001、9002', 'run', '投递中'); dim('outbox', 9003, false); }),
  step('这里有两个容易混的点。<em>READ COMMITTED 是隔离级别</em>，作用是去掉间隙锁，认领时不会挡住业务事务往 outbox 插新行；<em>SKIP LOCKED 是加锁行为</em>，作用是多个实例互不排队。租约过期的行排在前面，积压再多也不会被饿死。',
    0, () => { gone('code'); note('认领 SQL 的三个设计', `<ul><li><b>RC</b>：可重复读下范围加锁会带间隙锁，会挡住业务插入新事件；RC 只锁选中的行</li><li><b>SKIP LOCKED</b>：别人锁着的行直接跳过，多实例并行认领</li><li><b>UNION ALL 两路</b>：各走自己的索引（<code>idx_..._lease</code> / <code>idx_..._due</code>），过期租约优先</li><li>认领事务提交后，<b>SENDING + 未过期租约</b>本身就是“别碰我”的标记</li></ul>`, 182); }),
]);

scene('⑤ 投递与消费五步', [
  step('A 在<em>事务外</em>投递 9004。先看租约是否已过半（刚认领，不用续租）；再看 <code>deliver_at</code>（为空，不是延迟事件）；然后交给传输层。默认传输是 <code>local</code>：在同一个进程里直接调用消费者。',
    0, () => { clearMid(); card('TP', 306, 88, 384, '传输 transport = local（同进程同步调用）', 'ret', '默认', '传输'); },
    800, () => fly(`${ENV(9004)} {kind: ORDER_PAID, aggregateId: 1001, userId: 42}`, RA, [330, 140], ''),
    1700, () => card('CG', 306, 134, 384, '消费组 order-events · consume()', 'run', '进行中', '消费')),
  step('消费第 ① 步：<em>先校验信封</em>，此时还没碰数据库。版本号对不对、eventId 和 kind 是否合法、<em>这种事件是不是归这个消费组处理</em>。任何一项不对就直接拒绝。',
    0, () => gate('consume()：五步，后四步在同一个事务里', [['① 校验信封', ''], ['② 锁 outbox 行，逐字段核对', ''], ['③ DONE 或 inbox 已有 → 重复', ''], ['④ 投影（业务效果）', ''], ['⑤ inbox + DONE 一起提交', '']], 182),
    700, () => check(0, 'ok', '版本 · 类型 · 消费组 ✓')),
  step('第 ② 步：开事务，用 <code>FOR UPDATE</code> 锁住库里的 9004，逐字段核对 kind、aggregate_id、user_id、发生时间、投递时间。<em>消息只是一个定位符，事实以库里这一行为准</em>；锁住它，同一事件的另一份消息只能排队。',
    0, () => { fly('SELECT … FOR UPDATE', MID, toDB('outbox'), 'blue'); },
    800, () => { lock('outbox', 9004, 'X', 'CG'); hl('outbox', 9004); },
    1300, () => check(1, 'ok', '5 个字段一致')),
  step('第 ③ 步判重：行状态已经是 <code>DONE</code>，或者 <code>message_inbox</code> 里已有 (order-events, 9004)，就是重复消息，直接返回。都没有，而且不是 <code>REVIEW</code>，才往下走。',
    0, () => { fly('查 inbox', MID, toDB('inbox'), 'blue'); },
    900, () => check(2, 'ok', '首次')),
  step('第 ④ 步投影：核对订单 1001 确实是 PAID + MOCK，再 <code>INSERT IGNORE</code> 写订单历史；因为是支付事件，再用 <code>INSERT IGNORE</code> 登记第二跳任务 <code>ENTITLEMENT_GRANT</code>，唯一键是 <code>entitlement-grant:1001:CREDITS</code>。',
    0, () => { hl('outbox', 9004, null); fly('INSERT IGNORE', MID, toDB('event'), 'blue'); },
    800, () => row('event', 9004, { event_id: 9004, order_id: 1001, event_type: 'ORDER_PAID' }, 'CG'),
    1300, () => fly('INSERT IGNORE（idempotency_key）', MID, toDB('outbox'), 'blue'),
    2100, () => row('outbox', 9005, ob(9005, 'ENTITLEMENT_GRANT', 1001, 'PENDING', '03:20.5'), 'CG'),
    2400, () => check(3, 'ok', '历史 + 登记发权益')),
  step('第 ⑤ 步：写 inbox (order-events, 9004)，把 9004 标成 <code>DONE</code>，<em>和投影效果一起提交</em>。任何一步失败，投影、inbox、DONE 全部回滚，下次重投从头再来，不会出现“效果做了一半”。',
    0, () => { fly('INSERT inbox', MID, toDB('inbox'), 'blue'); },
    700, () => row('inbox', 'g9004', { group: 'order-events', event_id: 9004 }, 'CG'),
    1100, () => obSet(9004, { state: 'DONE', owner: '', lease: '' }),
    1700, () => { check(4, 'ok', '提交'); commit('CG'); txs('CG', 'ok'); }),
  step('回到实例 A：传输层调用返回后执行 <code>markSent</code>，条件是 <code>state = &#39;SENDING&#39; AND lease_owner = A</code>。可本地传输是同步消费的，行<em>已经是 DONE</em>，影响 0 行，什么也不改。第二跳 9005 会被下一轮认领（权益那一集再讲）。',
    0, () => { clearMid(); code(`UPDATE business_outbox SET state = 'SENT', sent_at = NOW(3), ...\nWHERE id = 9004 AND state = 'SENDING' AND lease_owner = 'A·7f3c'\n-- 影响 0 行：local 模式下 DONE 先于 SENT`, 182); },
    900, () => { relay('A', '本批完成', 'ok', '空闲'); gone('tx_CG'); }),
]);

scene('⑥ 消费失败', [
  step('实例 B 投递 9001：商品 7 的缓存失效事件，消费组 <code>catalog-cache</code>。投影要删 Redis 里的商品缓存，可 <em>Redis 暂时不可用</em>，抛出异常，消费事务整体回滚。',
    0, () => { clearMid(); clock('10:03:20.520'); },
    300, () => fly(`${ENV(9001)} PRODUCT_INVALIDATE`, RB, [330, 140], ''),
    1200, () => card('CG', 306, 134, 384, '消费组 catalog-cache · consume()', 'run', '进行中', '消费'),
    1700, () => gate('consume() · 9001', [['① 校验信封', ''], ['② 锁行核对', ''], ['③ 判重', ''], ['④ 投影：删除 Redis 商品缓存', '']], 182),
    2100, () => { check(0, 'ok'); check(1, 'ok'); check(2, 'ok', '首次'); },
    2700, () => { check(3, 'no', 'CacheUnavailableException'); txs('CG', 'rb', '已回滚'); }),
  step('接着记录失败：<code>consume_attempts + 1</code>，还没到 5 次，返回“未记录完成”；本地传输就把异常抛回中继，中继再执行 <code>recordSendFailure</code>：<code>attempts + 1</code>，改回 <code>PENDING</code>，<em>2 秒后</em>再试。',
