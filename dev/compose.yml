services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --binlog-expire-logs-seconds=604800
      --sync-binlog=1
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      SCHEMA_DB_PASSWORD: ${SCHEMA_DB_PASSWORD:?}
      CANAL_DB_PASSWORD: ${CANAL_DB_PASSWORD:?}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/01-accounts.sh:/docker-entrypoint-initdb.d/01-accounts.sh:ro
      - ./mysql/02-canal-accounts.sh:/docker-entrypoint-initdb.d/02-canal-accounts.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent']
      interval: 2s
      timeout: 2s
      retries: 60
  canal:
    image: ${COMPOSE_PROJECT_NAME:?}-canal:local
    build:
      context: ./canal
      dockerfile: Dockerfile
    entrypoint: [sh, /home/admin/canal-start.sh]
    environment:
      canal.destinations: ${APP_CDC_DESTINATION:?}
      CANAL_DESTINATION: ${APP_CDC_DESTINATION:?}
      CANAL_SCHEMA: ${MYSQL_DATABASE:?}
      CANAL_DB_HOST: mysql
      CANAL_DB_PORT: '3306'
      CANAL_DB_USERNAME: ai_canal
      CANAL_DB_PASSWORD: ${CANAL_DB_PASSWORD:?}
      CANAL_CLIENT_USER: ai_cdc_client
      CANAL_SERVER_PASSWORD: ${CANAL_SERVER_PASSWORD:?}
      CANAL_SLAVE_ID: ${CANAL_SLAVE_ID:?}
      TZ: UTC
    volumes:
      - canal-meta:/home/admin/canal-server/conf/${APP_CDC_DESTINATION:?}
      - ./canal/instance.properties:/home/admin/instance.properties.template:ro
      - ./canal/canal-start.sh:/home/admin/canal-start.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'nc -z 127.0.0.1 11111']
      interval: 3s
      timeout: 2s
      start_period: 30s
      retries: 30
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync always --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 2s
      retries: 30
  memcached:
    image: memcached:1.6-alpine@sha256:9e4de012dc607573052061c0bcb38abc775e1dd59b24e7ac38d1892842094aaf
    command: [memcached, -m, '64', -I, 2m]
  mq-store-init:
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    user: '0'
    entrypoint: [sh, -c]
    command: ['mkdir -p /home/rocketmq/store && chown -R 3000:3000 /home/rocketmq/store']
    volumes:
      - rocketmq-store:/home/rocketmq/store
  mq-nameserver:
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    command: [nameserver]
    environment:
      JAVA_OPT_EXT: '-Xms128m -Xmx128m -Xmn64m'
  rocketmq:
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    command: [broker, -c, /home/rocketmq/broker.conf]
    environment:
      JAVA_OPT_EXT: '-Xms256m -Xmx256m -Xmn128m'
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    depends_on:
      mq-store-init:
        condition: service_completed_successfully
      mq-nameserver:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'sh mqadmin clusterList -n mq-nameserver:9876 2>/dev/null | grep -q ai-platform-broker']
      interval: 3s
      timeout: 5s
      start_period: 20s
      retries: 30
  mq-init:
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    command: [sh, /home/rocketmq/init.sh]
    environment:
      APP_MQ_TOPIC: ${APP_MQ_TOPIC:?}
    volumes:
      - ./rocketmq/init.sh:/home/rocketmq/init.sh:ro
    depends_on:
      rocketmq:
        condition: service_healthy
  kafka-data-init:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    user: '0'
    entrypoint: [sh, -c]
    command: ['mkdir -p /var/lib/kafka/data && chown -R 1000:1000 /var/lib/kafka/data']
    volumes:
      - kafka-data:/var/lib/kafka/data
  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    hostname: kafka
    environment:
      CLUSTER_ID: ${APP_KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      TZ: UTC
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1']
      interval: 3s
      timeout: 10s
      start_period: 20s
      retries: 30
  kafka-init:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    entrypoint: [sh, /opt/kafka/init.sh]
    environment:
      APP_ANALYTICS_TOPIC: ${APP_ANALYTICS_TOPIC:?}
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./kafka/init.sh:/opt/kafka/init.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
  app:
    image: ${COMPOSE_PROJECT_NAME:?}-app:local
    build:
      context: ..
      dockerfile: dev/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-local}
      APP_DEMO_CODE_ENABLED: ${APP_DEMO_CODE_ENABLED:-false}
      APP_MONITOR_TOKEN: ${APP_MONITOR_TOKEN:-}
      APP_NAMESPACE: ${APP_NAMESPACE:?}
      APP_REDIS_PREFIX: ${APP_REDIS_PREFIX:?}
      APP_TRADE_MOCK_PAYMENT_ENABLED: ${APP_TRADE_MOCK_PAYMENT_ENABLED:-false}
      APP_TRADE_ORDER_TIMEOUT_MINUTES: ${APP_TRADE_ORDER_TIMEOUT_MINUTES:-15}
      APP_TRADE_EXPIRY_SCAN_ENABLED: ${APP_TRADE_EXPIRY_SCAN_ENABLED:-true}
      APP_TRADE_EXPIRY_SCAN_MS: ${APP_TRADE_EXPIRY_SCAN_MS:-5000}
      APP_TRADE_EXPIRY_SCAN_BATCH: ${APP_TRADE_EXPIRY_SCAN_BATCH:-50}
      APP_ENTITLEMENT_EXPIRY_SCAN_ENABLED: ${APP_ENTITLEMENT_EXPIRY_SCAN_ENABLED:-true}
      APP_ENTITLEMENT_EXPIRY_SCAN_MS: ${APP_ENTITLEMENT_EXPIRY_SCAN_MS:-60000}
      APP_ENTITLEMENT_EXPIRY_SCAN_BATCH: ${APP_ENTITLEMENT_EXPIRY_SCAN_BATCH:-100}
      APP_GENERATION_SUBMIT_ENABLED: ${APP_GENERATION_SUBMIT_ENABLED:-false}
      APP_CAMPAIGN_FULFILLMENT_MODE: ${APP_CAMPAIGN_FULFILLMENT_MODE:-stream}
      APP_CAMPAIGN_CONSUMER_ENABLED: ${APP_CAMPAIGN_CONSUMER_ENABLED:-true}
      APP_CAMPAIGN_CONSUMER_BATCH: ${APP_CAMPAIGN_CONSUMER_BATCH:-10}
      APP_CAMPAIGN_CONSUMER_BLOCK_MS: ${APP_CAMPAIGN_CONSUMER_BLOCK_MS:-1000}
      APP_CAMPAIGN_CLAIM_IDLE_MS: ${APP_CAMPAIGN_CLAIM_IDLE_MS:-5000}
      APP_CAMPAIGN_MAX_DELIVERIES: ${APP_CAMPAIGN_MAX_DELIVERIES:-5}
      APP_CAMPAIGN_REQUEST_TTL_SECONDS: ${APP_CAMPAIGN_REQUEST_TTL_SECONDS:-2592000}
      APP_CAMPAIGN_TRIM_ENABLED: ${APP_CAMPAIGN_TRIM_ENABLED:-true}
      APP_CAMPAIGN_TRIM_INTERVAL_MS: ${APP_CAMPAIGN_TRIM_INTERVAL_MS:-60000}
      APP_CAMPAIGN_RECONCILE_ENABLED: ${APP_CAMPAIGN_RECONCILE_ENABLED:-true}
      APP_CAMPAIGN_RECONCILE_INTERVAL_MS: ${APP_CAMPAIGN_RECONCILE_INTERVAL_MS:-60000}
      APP_MEDIA_ROOT: /app/media
      APP_MEDIA_MAX_FILE_BYTES: ${APP_MEDIA_MAX_FILE_BYTES:-5000000}
      APP_MEDIA_USER_BYTE_QUOTA: ${APP_MEDIA_USER_BYTE_QUOTA:-50000000}
      APP_MEDIA_USER_ASSET_QUOTA: ${APP_MEDIA_USER_ASSET_QUOTA:-100}
      APP_MEDIA_MAX_CREATION_MEDIA: ${APP_MEDIA_MAX_CREATION_MEDIA:-9}
      APP_MEDIA_PENDING_GRACE_SECONDS: ${APP_MEDIA_PENDING_GRACE_SECONDS:-300}
      APP_MEDIA_ORPHAN_GRACE_SECONDS: ${APP_MEDIA_ORPHAN_GRACE_SECONDS:-3600}
      APP_MEDIA_RECONCILE_ENABLED: ${APP_MEDIA_RECONCILE_ENABLED:-true}
      APP_MEDIA_RECONCILE_INTERVAL_MS: ${APP_MEDIA_RECONCILE_INTERVAL_MS:-60000}
      APP_COMMUNITY_SIGNIN_ZONE: ${APP_COMMUNITY_SIGNIN_ZONE:-Asia/Shanghai}
      APP_COMMUNITY_SIGNIN_TTL_SECONDS: ${APP_COMMUNITY_SIGNIN_TTL_SECONDS:-3456000}
      APP_COMMUNITY_FEED_BATCH: ${APP_COMMUNITY_FEED_BATCH:-200}
      APP_COMMUNITY_FEED_PAGE_MAX: ${APP_COMMUNITY_FEED_PAGE_MAX:-50}
      APP_CDC_ENABLED: ${APP_CDC_ENABLED:-true}
      APP_CDC_HOST: canal
      APP_CDC_PORT: '11111'
      APP_CDC_DESTINATION: ${APP_CDC_DESTINATION:?}
      APP_CDC_SCHEMA: ${MYSQL_DATABASE:?}
      APP_CDC_USERNAME: ai_cdc_client
      APP_CDC_PASSWORD: ${CANAL_CLIENT_PASSWORD:?}
      APP_CDC_BATCH_SIZE: ${APP_CDC_BATCH_SIZE:-200}
      APP_CDC_POLL_TIMEOUT_MS: ${APP_CDC_POLL_TIMEOUT_MS:-1000}
      APP_CDC_LEASE_SECONDS: ${APP_CDC_LEASE_SECONDS:-30}
      APP_CDC_RECONNECT_MS: ${APP_CDC_RECONNECT_MS:-1000}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
      APP_DB_USERNAME: ai_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      SCHEMA_DB_USERNAME: ai_schema
      SCHEMA_DB_PASSWORD: ${SCHEMA_DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      APP_CACHE_FALLBACK_CONCURRENCY: ${APP_CACHE_FALLBACK_CONCURRENCY:-4}
      APP_MEMCACHE_ENABLED: ${APP_MEMCACHE_ENABLED:-true}
      APP_MEMCACHE_HOST: memcached
      APP_MEMCACHE_PORT: '11211'
      APP_MEMCACHE_TIMEOUT_MS: '100'
      APP_MESSAGING_TRANSPORT: ${APP_MESSAGING_TRANSPORT:-local}
      APP_MQ_NAMESERVER: mq-nameserver:9876
      APP_MQ_TOPIC: ${APP_MQ_TOPIC:?}
      APP_MQ_GROUP_PREFIX: ${APP_MQ_GROUP_PREFIX:?}
      APP_MESSAGING_RELAY_ENABLED: ${APP_MESSAGING_RELAY_ENABLED:-true}
      APP_MESSAGING_WAKEUP_ENABLED: ${APP_MESSAGING_WAKEUP_ENABLED:-true}
      APP_MESSAGING_POLL_DELAY_MS: ${APP_MESSAGING_POLL_DELAY_MS:-1000}
      APP_MESSAGING_REDRIVE_SENT_SECONDS: ${APP_MESSAGING_REDRIVE_SENT_SECONDS:-30}
      APP_MESSAGING_REDRIVE_FAILED_SECONDS: ${APP_MESSAGING_REDRIVE_FAILED_SECONDS:-300}
      APP_MESSAGING_RETRY_BASE_SECONDS: ${APP_MESSAGING_RETRY_BASE_SECONDS:-1}
      APP_MESSAGING_MAX_CONSUME_ATTEMPTS: ${APP_MESSAGING_MAX_CONSUME_ATTEMPTS:-5}
      APP_ANALYTICS_ENABLED: ${APP_ANALYTICS_ENABLED:-true}
      APP_ANALYTICS_TOPIC: ${APP_ANALYTICS_TOPIC:?}
      APP_ANALYTICS_GROUP: ${APP_ANALYTICS_GROUP:?}
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_ANALYTICS_SEND_TIMEOUT_MS: ${APP_ANALYTICS_SEND_TIMEOUT_MS:-3000}
      APP_ANALYTICS_VISIT_QUEUE_CAPACITY: ${APP_ANALYTICS_VISIT_QUEUE_CAPACITY:-512}
      APP_ANALYTICS_MAX_SEND_ATTEMPTS: ${APP_ANALYTICS_MAX_SEND_ATTEMPTS:-30}
      APP_ANALYTICS_MAX_RETRY_SECONDS: ${APP_ANALYTICS_MAX_RETRY_SECONDS:-300}
      APP_ANALYTICS_VISIT_ATTEMPTS: ${APP_ANALYTICS_VISIT_ATTEMPTS:-3}
      APP_ANALYTICS_CLIENT_ID: ${APP_ANALYTICS_CLIENT_ID:-ai-creation-analytics}
      APP_ANALYTICS_RELAY_ENABLED: ${APP_ANALYTICS_RELAY_ENABLED:-true}
      APP_ANALYTICS_RELAY_BATCH: ${APP_ANALYTICS_RELAY_BATCH:-50}
      APP_ANALYTICS_LEASE_SECONDS: ${APP_ANALYTICS_LEASE_SECONDS:-30}
      APP_ANALYTICS_POLL_DELAY_MS: ${APP_ANALYTICS_POLL_DELAY_MS:-1000}
      APP_ANALYTICS_SENT_RECOVERY_SECONDS: ${APP_ANALYTICS_SENT_RECOVERY_SECONDS:-60}
      APP_ANALYTICS_SENT_RECOVERY_INTERVAL_MS: ${APP_ANALYTICS_SENT_RECOVERY_INTERVAL_MS:-15000}
      APP_ANALYTICS_CONSUMER_ENABLED: ${APP_ANALYTICS_CONSUMER_ENABLED:-true}
      APP_ANALYTICS_POLL_RECORDS: ${APP_ANALYTICS_POLL_RECORDS:-50}
      APP_ANALYTICS_POLL_TIMEOUT_MS: ${APP_ANALYTICS_POLL_TIMEOUT_MS:-1000}
      APP_ANALYTICS_RETRY_BACKOFF_MS: ${APP_ANALYTICS_RETRY_BACKOFF_MS:-1000}
      APP_ANALYTICS_BACKFILL_ENABLED: ${APP_ANALYTICS_BACKFILL_ENABLED:-true}
      APP_ANALYTICS_BACKFILL_DAYS: ${APP_ANALYTICS_BACKFILL_DAYS:-7}
      APP_ANALYTICS_BACKFILL_BATCH: ${APP_ANALYTICS_BACKFILL_BATCH:-200}
      APP_ANALYTICS_BACKFILL_INTERVAL_MS: ${APP_ANALYTICS_BACKFILL_INTERVAL_MS:-500}
      APP_ANALYTICS_RETENTION_DAYS: ${APP_ANALYTICS_RETENTION_DAYS:-30}
      APP_ANALYTICS_MAX_CLOCK_SKEW_MINUTES: ${APP_ANALYTICS_MAX_CLOCK_SKEW_MINUTES:-5}
      APP_ANALYTICS_CLEANUP_INTERVAL_MS: ${APP_ANALYTICS_CLEANUP_INTERVAL_MS:-3600000}
      APP_ANALYTICS_HEAT_VISIT_WEIGHT: ${APP_ANALYTICS_HEAT_VISIT_WEIGHT:-1}
      APP_ANALYTICS_HEAT_UV_WEIGHT: ${APP_ANALYTICS_HEAT_UV_WEIGHT:-2}
      APP_ANALYTICS_HEAT_ORDER_WEIGHT: ${APP_ANALYTICS_HEAT_ORDER_WEIGHT:-5}
      APP_ANALYTICS_HEAT_PAYMENT_WEIGHT: ${APP_ANALYTICS_HEAT_PAYMENT_WEIGHT:-10}
      APP_ANALYTICS_HEAT_CLAIM_WEIGHT: ${APP_ANALYTICS_HEAT_CLAIM_WEIGHT:-8}
    ports:
      - '127.0.0.1:${APP_HTTP_PORT:?}:8080'
    volumes:
      - media-data:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      memcached:
        condition: service_started
      mq-init:
        condition: service_completed_successfully
      canal:
        condition: service_started
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '3', http://127.0.0.1:8080/actuator/health/readiness]
      interval: 3s
      timeout: 4s
      start_period: 20s
      retries: 20
volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
  media-data:
  canal-meta:
  kafka-data:
