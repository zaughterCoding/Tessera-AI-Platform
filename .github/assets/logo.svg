<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Tessera logo">
  <title>Tessera</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="4" y="4" width="152" height="152" rx="36" fill="url(#bg)"/>

  <!-- 3x3 马赛克，左上缺一块：最后一块正在落位 -->
  <g>
    <rect x="66" y="30" width="28" height="28" rx="7" fill="url(#t2)"/>
    <rect x="102" y="30" width="28" height="28" rx="7" fill="url(#t3)" opacity="0.9"/>

    <rect x="30" y="66" width="28" height="28" rx="7" fill="url(#t1)" opacity="0.85"/>
    <rect x="66" y="66" width="28" height="28" rx="7" fill="url(#t1)"/>
    <rect x="102" y="66" width="28" height="28" rx="7" fill="url(#t2)" opacity="0.9"/>

    <rect x="30" y="102" width="28" height="28" rx="7" fill="url(#t3)"/>
    <rect x="66" y="102" width="28" height="28" rx="7" fill="url(#t2)" opacity="0.8"/>
    <rect x="102" y="102" width="28" height="28" rx="7" fill="url(#t1)" opacity="0.95"/>
  </g>

  <!-- 金色凭证块：倾斜落入，带 AI 星芒 -->
  <g transform="rotate(-12 42 40)">
    <rect x="25" y="23" width="34" height="34" rx="8" fill="url(#gold)"/>
    <path d="M42 30 L44.6 37.4 L52 40 L44.6 42.6 L42 50 L39.4 42.6 L32 40 L39.4 37.4 Z" fill="#1e1b4b"/>
  </g>
</svg>
