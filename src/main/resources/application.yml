server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: none
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application:
    name: ai-creation-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      connection-timeout: 2000
      validation-timeout: 1000
      # 数据库进程冻结时 TCP 仍可写，只有 socket 超时能让请求有界失败而不是无限挂起。
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 15000
  flyway:
    url: ${DB_URL}
    user: ${SCHEMA_DB_USERNAME}
    password: ${SCHEMA_DB_PASSWORD}
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${APP_MEDIA_MAX_FILE_BYTES:5000000}
      max-request-size: 6000000
  # 活动对账等后台任务不得阻塞 Outbox 轮询与其他定时任务。
  task:
    scheduling:
      pool:
        size: ${APP_SCHEDULING_POOL_SIZE:4}
app:
  namespace: ${APP_NAMESPACE}
  redis:
    key-prefix: ${APP_REDIS_PREFIX}
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
    local-ttl-seconds: ${APP_CACHE_LOCAL_TTL_SECONDS:5}
    rebuild-wait-seconds: ${APP_CACHE_REBUILD_WAIT_SECONDS:2}
    rebuild-lock-seconds: ${APP_CACHE_REBUILD_LOCK_SECONDS:10}
    redis-backoff-ms: ${APP_CACHE_REDIS_BACKOFF_MS:1000}
    listener-retry-ms: ${APP_CACHE_LISTENER_RETRY_MS:2000}
    fallback:
      max-concurrent: ${APP_CACHE_FALLBACK_CONCURRENCY:4}
      acquire-timeout-ms: ${APP_CACHE_FALLBACK_ACQUIRE_TIMEOUT_MS:50}
    memcache:
      enabled: ${APP_MEMCACHE_ENABLED:false}
      host: ${APP_MEMCACHE_HOST:127.0.0.1}
      port: ${APP_MEMCACHE_PORT:11211}
      timeout-ms: ${APP_MEMCACHE_TIMEOUT_MS:100}
  identity:
    demo-code-enabled: ${APP_DEMO_CODE_ENABLED:false}
    session-ttl-seconds: 1800
    monitor-token: ${APP_MONITOR_TOKEN:}
  cdc:
    enabled: ${APP_CDC_ENABLED:false}
    host: ${APP_CDC_HOST:127.0.0.1}
    port: ${APP_CDC_PORT:11111}
    destination: ${APP_CDC_DESTINATION:ai_creation}
    schema: ${APP_CDC_SCHEMA:}
    username: ${APP_CDC_USERNAME:}
    password: ${APP_CDC_PASSWORD:}
    batch-size: ${APP_CDC_BATCH_SIZE:200}
    poll-timeout-ms: ${APP_CDC_POLL_TIMEOUT_MS:1000}
    lease-seconds: ${APP_CDC_LEASE_SECONDS:30}
    reconnect-ms: ${APP_CDC_RECONNECT_MS:1000}
  trade:
    order-timeout-minutes: ${APP_TRADE_ORDER_TIMEOUT_MINUTES:15}
    mock-payment-enabled: ${APP_TRADE_MOCK_PAYMENT_ENABLED:false}
    expiry-scan-enabled: ${APP_TRADE_EXPIRY_SCAN_ENABLED:true}
    expiry-scan-ms: ${APP_TRADE_EXPIRY_SCAN_MS:5000}
    expiry-scan-batch: ${APP_TRADE_EXPIRY_SCAN_BATCH:50}
  entitlement:
    # 到期扫描只做余额清理兜底；查询始终按数据库时间隐藏已过期的可用次数。
    expiry-scan-enabled: ${APP_ENTITLEMENT_EXPIRY_SCAN_ENABLED:true}
    expiry-scan-ms: ${APP_ENTITLEMENT_EXPIRY_SCAN_MS:60000}
    expiry-scan-batch: ${APP_ENTITLEMENT_EXPIRY_SCAN_BATCH:100}
  generation:
    # 调度与上游尚未接入时默认关闭新提交；本人任务与权益查询不受影响。
    submit-enabled: ${APP_GENERATION_SUBMIT_ENABLED:false}
  campaign:
    fulfillment-mode: ${APP_CAMPAIGN_FULFILLMENT_MODE:stream}
    consumer-enabled: ${APP_CAMPAIGN_CONSUMER_ENABLED:true}
    consumer-batch: ${APP_CAMPAIGN_CONSUMER_BATCH:10}
    consumer-block-ms: ${APP_CAMPAIGN_CONSUMER_BLOCK_MS:1000}
    claim-idle-ms: ${APP_CAMPAIGN_CLAIM_IDLE_MS:5000}
    max-deliveries: ${APP_CAMPAIGN_MAX_DELIVERIES:5}
    request-ttl-seconds: ${APP_CAMPAIGN_REQUEST_TTL_SECONDS:2592000}
    trim-enabled: ${APP_CAMPAIGN_TRIM_ENABLED:true}
    trim-interval-ms: ${APP_CAMPAIGN_TRIM_INTERVAL_MS:60000}
    reconcile-enabled: ${APP_CAMPAIGN_RECONCILE_ENABLED:true}
    reconcile-interval-ms: ${APP_CAMPAIGN_RECONCILE_INTERVAL_MS:60000}
  media:
    root: ${APP_MEDIA_ROOT:./.local/media}
    max-file-bytes: ${APP_MEDIA_MAX_FILE_BYTES:5000000}
    user-byte-quota: ${APP_MEDIA_USER_BYTE_QUOTA:50000000}
    user-asset-quota: ${APP_MEDIA_USER_ASSET_QUOTA:100}
    max-creation-media: ${APP_MEDIA_MAX_CREATION_MEDIA:9}
    pending-grace-seconds: ${APP_MEDIA_PENDING_GRACE_SECONDS:300}
    orphan-grace-seconds: ${APP_MEDIA_ORPHAN_GRACE_SECONDS:3600}
    reconcile-enabled: ${APP_MEDIA_RECONCILE_ENABLED:true}
    reconcile-interval-ms: ${APP_MEDIA_RECONCILE_INTERVAL_MS:60000}
  community:
    signin-zone: ${APP_COMMUNITY_SIGNIN_ZONE:Asia/Shanghai}
    signin-ttl-seconds: ${APP_COMMUNITY_SIGNIN_TTL_SECONDS:3456000}
    feed-batch: ${APP_COMMUNITY_FEED_BATCH:200}
    feed-page-max: ${APP_COMMUNITY_FEED_PAGE_MAX:50}
  messaging:
    transport: ${APP_MESSAGING_TRANSPORT:local}
    name-server: ${APP_MQ_NAMESERVER:}
    topic: ${APP_MQ_TOPIC:}
    consumer-group-prefix: ${APP_MQ_GROUP_PREFIX:}
    relay-enabled: ${APP_MESSAGING_RELAY_ENABLED:true}
    poll-delay-ms: ${APP_MESSAGING_POLL_DELAY_MS:1000}
    batch-size: ${APP_MESSAGING_BATCH_SIZE:50}
    lease-seconds: ${APP_MESSAGING_LEASE_SECONDS:30}
    redrive-sent-seconds: ${APP_MESSAGING_REDRIVE_SENT_SECONDS:30}
    redrive-failed-seconds: ${APP_MESSAGING_REDRIVE_FAILED_SECONDS:300}
    retry-base-seconds: ${APP_MESSAGING_RETRY_BASE_SECONDS:1}
    retry-max-seconds: ${APP_MESSAGING_RETRY_MAX_SECONDS:300}
    max-send-attempts: ${APP_MESSAGING_MAX_SEND_ATTEMPTS:10}
    max-consume-attempts: ${APP_MESSAGING_MAX_CONSUME_ATTEMPTS:5}
  analytics:
    enabled: ${APP_ANALYTICS_ENABLED:false}
    topic: ${APP_ANALYTICS_TOPIC:}
    group: ${APP_ANALYTICS_GROUP:}
    bootstrap-servers: ${APP_KAFKA_BOOTSTRAP_SERVERS:}
    client-id: ${APP_ANALYTICS_CLIENT_ID:ai-creation-analytics}
    visit-queue-capacity: ${APP_ANALYTICS_VISIT_QUEUE_CAPACITY:512}
    visit-attempts: ${APP_ANALYTICS_VISIT_ATTEMPTS:3}
    send-timeout-ms: ${APP_ANALYTICS_SEND_TIMEOUT_MS:3000}
    relay-batch: ${APP_ANALYTICS_RELAY_BATCH:50}
    lease-seconds: ${APP_ANALYTICS_LEASE_SECONDS:30}
    relay-enabled: ${APP_ANALYTICS_RELAY_ENABLED:true}
    max-send-attempts: ${APP_ANALYTICS_MAX_SEND_ATTEMPTS:30}
    max-retry-seconds: ${APP_ANALYTICS_MAX_RETRY_SECONDS:300}
    poll-delay-ms: ${APP_ANALYTICS_POLL_DELAY_MS:1000}
    sent-recovery-seconds: ${APP_ANALYTICS_SENT_RECOVERY_SECONDS:60}
    sent-recovery-interval-ms: ${APP_ANALYTICS_SENT_RECOVERY_INTERVAL_MS:15000}
    consumer-enabled: ${APP_ANALYTICS_CONSUMER_ENABLED:true}
    poll-records: ${APP_ANALYTICS_POLL_RECORDS:50}
    poll-timeout-ms: ${APP_ANALYTICS_POLL_TIMEOUT_MS:1000}
    retry-backoff-ms: ${APP_ANALYTICS_RETRY_BACKOFF_MS:1000}
    backfill-enabled: ${APP_ANALYTICS_BACKFILL_ENABLED:true}
    backfill-days: ${APP_ANALYTICS_BACKFILL_DAYS:7}
    backfill-batch: ${APP_ANALYTICS_BACKFILL_BATCH:200}
    backfill-interval-ms: ${APP_ANALYTICS_BACKFILL_INTERVAL_MS:500}
    retention-days: ${APP_ANALYTICS_RETENTION_DAYS:30}
    max-clock-skew-minutes: ${APP_ANALYTICS_MAX_CLOCK_SKEW_MINUTES:5}
    cleanup-interval-ms: ${APP_ANALYTICS_CLEANUP_INTERVAL_MS:3600000}
    heat-visit-weight: ${APP_ANALYTICS_HEAT_VISIT_WEIGHT:1}
    heat-uv-weight: ${APP_ANALYTICS_HEAT_UV_WEIGHT:2}
    heat-order-weight: ${APP_ANALYTICS_HEAT_ORDER_WEIGHT:5}
    heat-payment-weight: ${APP_ANALYTICS_HEAT_PAYMENT_WEIGHT:10}
    heat-claim-weight: ${APP_ANALYTICS_HEAT_CLAIM_WEIGHT:8}
  experience:
    # 技术体验默认关闭，且只允许在显式 local/test 配置下启用。
    enabled: ${APP_EXPERIENCE_ENABLED:false}
  operations:
    metrics-interval-ms: ${APP_OPERATIONS_METRICS_INTERVAL_MS:15000}
    metrics-initial-delay-ms: ${APP_OPERATIONS_METRICS_INITIAL_DELAY_MS:5000}
    dependency-check-interval-ms: ${APP_OPERATIONS_DEPENDENCY_INTERVAL_MS:15000}
    dependency-check-initial-delay-ms: ${APP_OPERATIONS_DEPENDENCY_INITIAL_DELAY_MS:5000}
  retention:
    cleanup-enabled: ${APP_RETENTION_CLEANUP_ENABLED:true}
    cleanup-interval-ms: ${APP_RETENTION_CLEANUP_INTERVAL_MS:86400000}
    outbox-done-days: ${APP_RETENTION_OUTBOX_DONE_DAYS:30}
    inbox-days: ${APP_RETENTION_INBOX_DAYS:30}
    message-failure-days: ${APP_RETENTION_MESSAGE_FAILURE_DAYS:30}
    analytics-failure-days: ${APP_RETENTION_ANALYTICS_FAILURE_DAYS:30}
    audit-days: ${APP_RETENTION_AUDIT_DAYS:365}
    batch-size: ${APP_RETENTION_BATCH_SIZE:500}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
logging:
  level:
    com.aiplatform: info
