server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: none
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application:
    name: ai-creation-platform
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    url: ${DB_URL}
    user: ${SCHEMA_DB_USERNAME}
    password: ${SCHEMA_DB_PASSWORD}
    baseline-on-migrate: false
    clean-disabled: true
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    timeout: 2s
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
app:
  namespace: ${APP_NAMESPACE}
  redis:
    key-prefix: ${APP_REDIS_PREFIX}
  identity:
    demo-code-enabled: ${APP_DEMO_CODE_ENABLED:false}
    session-ttl-seconds: 1800
    monitor-token: ${APP_MONITOR_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
logging:
  level:
    com.aiplatform: info
