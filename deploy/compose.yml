name: ${COMPOSE_PROJECT_NAME:?}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --binlog-expire-logs-seconds=604800
      --sync-binlog=1
      --max-connections=100
      --innodb-buffer-pool-size=256M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      SCHEMA_DB_PASSWORD: ${SCHEMA_DB_PASSWORD:?}
      CANAL_DB_PASSWORD: ${CANAL_DB_PASSWORD:?}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/01-accounts.sh:/docker-entrypoint-initdb.d/01-accounts.sh:ro
      - ./mysql/02-canal-accounts.sh:/docker-entrypoint-initdb.d/02-canal-accounts.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent']
      interval: 3s
      timeout: 3s
      retries: 60
    logging: *default-logging
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256

  canal:
    image: ${COMPOSE_PROJECT_NAME:?}-canal:local
    build:
      context: ./canal
      dockerfile: Dockerfile
    entrypoint: [sh, /home/admin/canal-start.sh]
    environment:
      canal.destinations: ${APP_CDC_DESTINATION:?}
      CANAL_DESTINATION: ${APP_CDC_DESTINATION:?}
      CANAL_SCHEMA: ${MYSQL_DATABASE:?}
      CANAL_DB_HOST: mysql
      CANAL_DB_PORT: '3306'
      CANAL_DB_USERNAME: ai_canal
      CANAL_DB_PASSWORD: ${CANAL_DB_PASSWORD:?}
      CANAL_CLIENT_USER: ai_cdc_client
      CANAL_SERVER_PASSWORD: ${CANAL_SERVER_PASSWORD:?}
      CANAL_SLAVE_ID: ${CANAL_SLAVE_ID:?}
      TZ: UTC
    volumes:
      - canal-meta:/home/admin/canal-server/conf/${APP_CDC_DESTINATION:?}
      - ./canal/instance.properties:/home/admin/instance.properties.template:ro
      - ./canal/canal-start.sh:/home/admin/canal-start.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'nc -z 127.0.0.1 11111']
      interval: 3s
      timeout: 2s
      start_period: 30s
      retries: 30
    logging: *default-logging
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync always --maxmemory 384mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 2s
      retries: 30
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  memcached:
    image: memcached:1.6-alpine@sha256:9e4de012dc607573052061c0bcb38abc775e1dd59b24e7ac38d1892842094aaf
    command: [memcached, -m, '64', -I, 2m]
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  mq-store-init:
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    user: '0'
    entrypoint: [sh, -c]
    command: ['mkdir -p /home/rocketmq/store && chown -R 3000:3000 /home/rocketmq/store']
    volumes:
      - rocketmq-store:/home/rocketmq/store
    logging: *default-logging

  mq-nameserver:
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    command: [nameserver]
    environment:
      JAVA_OPT_EXT: '-Xms128m -Xmx128m -Xmn64m'
    logging: *default-logging
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256

  rocketmq:
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    command: [broker, -c, /home/rocketmq/broker.conf]
    environment:
      JAVA_OPT_EXT: '-Xms256m -Xmx256m -Xmn128m'
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    depends_on:
      mq-store-init:
        condition: service_completed_successfully
      mq-nameserver:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'sh mqadmin clusterList -n mq-nameserver:9876 2>/dev/null | grep -q ai-platform-broker']
      interval: 3s
      timeout: 5s
      start_period: 20s
      retries: 30
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 256

  mq-init:
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    command: [sh, /home/rocketmq/init.sh]
    environment:
      APP_MQ_TOPIC: ${APP_MQ_TOPIC:?}
    volumes:
      - ./rocketmq/init.sh:/home/rocketmq/init.sh:ro
    depends_on:
      rocketmq:
        condition: service_healthy
    logging: *default-logging

  kafka-data-init:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    user: '0'
    entrypoint: [sh, -c]
    command: ['mkdir -p /var/lib/kafka/data && chown -R 1000:1000 /var/lib/kafka/data']
    volumes:
      - kafka-data:/var/lib/kafka/data
    logging: *default-logging

  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    hostname: kafka
    environment:
      CLUSTER_ID: ${APP_KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx256m'
      TZ: UTC
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1']
      interval: 3s
      timeout: 10s
      start_period: 20s
      retries: 30
    logging: *default-logging
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256

  kafka-init:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    entrypoint: [sh, /opt/kafka/init.sh]
    environment:
      APP_ANALYTICS_TOPIC: ${APP_ANALYTICS_TOPIC:?}
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./kafka/init.sh:/opt/kafka/init.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    logging: *default-logging

  app:
    image: ${COMPOSE_PROJECT_NAME:?}-app:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-release}
      APP_DEMO_CODE_ENABLED: ${APP_DEMO_CODE_ENABLED:-false}
      APP_EXPERIENCE_ENABLED: ${APP_EXPERIENCE_ENABLED:-false}
      APP_MONITOR_TOKEN: ${APP_MONITOR_TOKEN:?}
      APP_NAMESPACE: ${APP_NAMESPACE:?}
      APP_REDIS_PREFIX: ${APP_REDIS_PREFIX:?}
      APP_TRADE_MOCK_PAYMENT_ENABLED: ${APP_TRADE_MOCK_PAYMENT_ENABLED:-false}
      APP_TRADE_ORDER_TIMEOUT_MINUTES: ${APP_TRADE_ORDER_TIMEOUT_MINUTES:-15}
      APP_TRADE_EXPIRY_SCAN_ENABLED: ${APP_TRADE_EXPIRY_SCAN_ENABLED:-true}
      APP_TRADE_EXPIRY_SCAN_MS: ${APP_TRADE_EXPIRY_SCAN_MS:-5000}
      APP_TRADE_EXPIRY_SCAN_BATCH: ${APP_TRADE_EXPIRY_SCAN_BATCH:-50}
      APP_ENTITLEMENT_EXPIRY_SCAN_ENABLED: ${APP_ENTITLEMENT_EXPIRY_SCAN_ENABLED:-true}
      APP_ENTITLEMENT_EXPIRY_SCAN_MS: ${APP_ENTITLEMENT_EXPIRY_SCAN_MS:-60000}
      APP_ENTITLEMENT_EXPIRY_SCAN_BATCH: ${APP_ENTITLEMENT_EXPIRY_SCAN_BATCH:-100}
      APP_GENERATION_SUBMIT_ENABLED: ${APP_GENERATION_SUBMIT_ENABLED:-false}
      APP_GENERATION_SCHEDULING_ENABLED: ${APP_GENERATION_SCHEDULING_ENABLED:-true}
      APP_GENERATION_POLLING_ENABLED: ${APP_GENERATION_POLLING_ENABLED:-true}
      APP_GENERATION_SIMULATOR_ENABLED: ${APP_GENERATION_SIMULATOR_ENABLED:-true}
      APP_GENERATION_SIMULATOR_FAULT_CONTROL_ENABLED: ${APP_GENERATION_SIMULATOR_FAULT_CONTROL_ENABLED:-false}
      APP_GENERATION_SIMULATOR_CALLBACK_ENABLED: ${APP_GENERATION_SIMULATOR_CALLBACK_ENABLED:-false}
      APP_GENERATION_SIMULATOR_CALLBACK_URL: ${APP_GENERATION_SIMULATOR_CALLBACK_URL:-}
      APP_GENERATION_CHANNEL_CODE: ${APP_GENERATION_CHANNEL_CODE:-simulated-primary}
      APP_GENERATION_CHANNEL_MAX_IN_FLIGHT: ${APP_GENERATION_CHANNEL_MAX_IN_FLIGHT:-4}
      APP_GENERATION_CHANNEL_QUEUE_CAPACITY: ${APP_GENERATION_CHANNEL_QUEUE_CAPACITY:-200}
      APP_GENERATION_QUEUE_TIMEOUT_SECONDS: ${APP_GENERATION_QUEUE_TIMEOUT_SECONDS:-1800}
      APP_GENERATION_USER_ACTIVE_LIMIT: ${APP_GENERATION_USER_ACTIVE_LIMIT:-5}
      APP_GENERATION_DEFAULT_SCHEDULE_WEIGHT: ${APP_GENERATION_DEFAULT_SCHEDULE_WEIGHT:-1}
      APP_GENERATION_FAIR_SCHEDULING_ENABLED: ${APP_GENERATION_FAIR_SCHEDULING_ENABLED:-true}
      APP_GENERATION_ADAPTIVE_CONCURRENCY_ENABLED: ${APP_GENERATION_ADAPTIVE_CONCURRENCY_ENABLED:-true}
      APP_GENERATION_ADAPTIVE_INITIAL_IN_FLIGHT: ${APP_GENERATION_ADAPTIVE_INITIAL_IN_FLIGHT:-4}
      APP_GENERATION_ADAPTIVE_WINDOW_SECONDS: ${APP_GENERATION_ADAPTIVE_WINDOW_SECONDS:-5}
      APP_GENERATION_ADAPTIVE_PAUSE_SECONDS: ${APP_GENERATION_ADAPTIVE_PAUSE_SECONDS:-5}
      APP_GENERATION_DISPATCH_BATCH: ${APP_GENERATION_DISPATCH_BATCH:-20}
      APP_GENERATION_POLL_BATCH: ${APP_GENERATION_POLL_BATCH:-20}
      APP_GENERATION_DISPATCH_INTERVAL_MS: ${APP_GENERATION_DISPATCH_INTERVAL_MS:-2000}
      APP_GENERATION_POLL_SCAN_INTERVAL_MS: ${APP_GENERATION_POLL_SCAN_INTERVAL_MS:-2000}
      APP_GENERATION_LEASE_SECONDS: ${APP_GENERATION_LEASE_SECONDS:-30}
      APP_GENERATION_SUBMIT_MAX_ATTEMPTS: ${APP_GENERATION_SUBMIT_MAX_ATTEMPTS:-5}
      APP_GENERATION_QUERY_MAX_ATTEMPTS: ${APP_GENERATION_QUERY_MAX_ATTEMPTS:-8}
      APP_GENERATION_RETRY_BASE_SECONDS: ${APP_GENERATION_RETRY_BASE_SECONDS:-2}
      APP_GENERATION_RETRY_MAX_SECONDS: ${APP_GENERATION_RETRY_MAX_SECONDS:-60}
      APP_GENERATION_POLL_INTERVAL_SECONDS: ${APP_GENERATION_POLL_INTERVAL_SECONDS:-2}
      APP_GENERATION_REVIEW_POLL_SECONDS: ${APP_GENERATION_REVIEW_POLL_SECONDS:-300}
      APP_GENERATION_SIMULATOR_DEFAULT_DURATION_MS: ${APP_GENERATION_SIMULATOR_DEFAULT_DURATION_MS:-3000}
      APP_GENERATION_SIMULATOR_QUERY_FAILURES: ${APP_GENERATION_SIMULATOR_QUERY_FAILURES:-3}
      APP_GENERATION_SIMULATOR_MAX_CONCURRENT: ${APP_GENERATION_SIMULATOR_MAX_CONCURRENT:-0}
      APP_GENERATION_SIMULATOR_CALLBACK_TIMEOUT_MS: ${APP_GENERATION_SIMULATOR_CALLBACK_TIMEOUT_MS:-2000}
      APP_GENERATION_CALLBACK_MAX_SKEW_SECONDS: ${APP_GENERATION_CALLBACK_MAX_SKEW_SECONDS:-300}
      APP_GENERATION_CALLBACK_MAX_BYTES: ${APP_GENERATION_CALLBACK_MAX_BYTES:-8192}
      APP_GENERATION_CALLBACK_SECRET: ${APP_GENERATION_CALLBACK_SECRET:-}
      APP_GENERATION_HTTP_ENABLED: ${APP_GENERATION_HTTP_ENABLED:-false}
      APP_GENERATION_HTTP_BASE_URL: ${APP_GENERATION_HTTP_BASE_URL:-}
      APP_GENERATION_HTTP_SUBMIT_PATH: ${APP_GENERATION_HTTP_SUBMIT_PATH:-/v1/images/jobs}
      APP_GENERATION_HTTP_TASK_PATH: ${APP_GENERATION_HTTP_TASK_PATH:-/v1/images/jobs/{taskId}}
      APP_GENERATION_HTTP_CANCEL_PATH: ${APP_GENERATION_HTTP_CANCEL_PATH:-}
      APP_GENERATION_HTTP_MODEL: ${APP_GENERATION_HTTP_MODEL:-}
      APP_GENERATION_HTTP_API_KEY: ${APP_GENERATION_HTTP_API_KEY:-}
      APP_GENERATION_HTTP_AUTH_SCHEME: ${APP_GENERATION_HTTP_AUTH_SCHEME:-Bearer}
      APP_GENERATION_HTTP_ALLOW_INSECURE_HTTP: ${APP_GENERATION_HTTP_ALLOW_INSECURE_HTTP:-false}
      APP_GENERATION_HTTP_REAL_CALL_LIMIT: ${APP_GENERATION_HTTP_REAL_CALL_LIMIT:-0}
      APP_GENERATION_HTTP_CONNECT_TIMEOUT_MS: ${APP_GENERATION_HTTP_CONNECT_TIMEOUT_MS:-3000}
      APP_GENERATION_HTTP_REQUEST_TIMEOUT_MS: ${APP_GENERATION_HTTP_REQUEST_TIMEOUT_MS:-30000}
      APP_GENERATION_HTTP_QUERY_TIMEOUT_MS: ${APP_GENERATION_HTTP_QUERY_TIMEOUT_MS:-10000}
      APP_GENERATION_HTTP_MAX_RESPONSE_BYTES: ${APP_GENERATION_HTTP_MAX_RESPONSE_BYTES:-262144}
      APP_GENERATION_HTTP_IDEMPOTENT_SUBMIT: ${APP_GENERATION_HTTP_IDEMPOTENT_SUBMIT:-false}
      APP_GENERATION_HTTP_QUERY_BY_ATTEMPT: ${APP_GENERATION_HTTP_QUERY_BY_ATTEMPT:-false}
      APP_GENERATION_HTTP_DISPLAY_NAME: ${APP_GENERATION_HTTP_DISPLAY_NAME:-HTTP 图片渠道}
      APP_GENERATION_RESULT_ENABLED: ${APP_GENERATION_RESULT_ENABLED:-true}
      APP_GENERATION_RESULT_BATCH: ${APP_GENERATION_RESULT_BATCH:-10}
      APP_GENERATION_RESULT_LEASE_SECONDS: ${APP_GENERATION_RESULT_LEASE_SECONDS:-60}
      APP_GENERATION_RESULT_MAX_SAVE_ATTEMPTS: ${APP_GENERATION_RESULT_MAX_SAVE_ATTEMPTS:-5}
      APP_GENERATION_RESULT_RETRY_BASE_SECONDS: ${APP_GENERATION_RESULT_RETRY_BASE_SECONDS:-2}
      APP_GENERATION_RESULT_RETRY_MAX_SECONDS: ${APP_GENERATION_RESULT_RETRY_MAX_SECONDS:-60}
      APP_GENERATION_RESULT_SCAN_INTERVAL_MS: ${APP_GENERATION_RESULT_SCAN_INTERVAL_MS:-2000}
      APP_GENERATION_RESULT_SETTLEMENT_BATCH: ${APP_GENERATION_RESULT_SETTLEMENT_BATCH:-50}
      APP_GENERATION_RESULT_SETTLEMENT_INTERVAL_MS: ${APP_GENERATION_RESULT_SETTLEMENT_INTERVAL_MS:-5000}
      APP_GENERATION_RESULT_CONNECT_TIMEOUT_MS: ${APP_GENERATION_RESULT_CONNECT_TIMEOUT_MS:-2000}
      APP_GENERATION_RESULT_READ_TIMEOUT_MS: ${APP_GENERATION_RESULT_READ_TIMEOUT_MS:-5000}
      APP_GENERATION_RESULT_TOTAL_TIMEOUT_MS: ${APP_GENERATION_RESULT_TOTAL_TIMEOUT_MS:-15000}
      APP_GENERATION_RESULT_MAX_BYTES: ${APP_GENERATION_RESULT_MAX_BYTES:-10000000}
      APP_GENERATION_RESULT_MAX_REDIRECTS: ${APP_GENERATION_RESULT_MAX_REDIRECTS:-3}
      APP_GENERATION_RESULT_ALLOWED_HOSTS: ${APP_GENERATION_RESULT_ALLOWED_HOSTS:-}
      APP_GENERATION_RESULT_ALLOW_PRIVATE_HOSTS: ${APP_GENERATION_RESULT_ALLOW_PRIVATE_HOSTS:-false}
      APP_GENERATION_RESULT_DOWNLOAD_SECRET: ${APP_GENERATION_RESULT_DOWNLOAD_SECRET:-}
      APP_GENERATION_RESULT_SIMULATOR_RESULT_BASE_URL: ${APP_GENERATION_RESULT_SIMULATOR_RESULT_BASE_URL:-}
      APP_GENERATION_RESULT_ORPHAN_GRACE_SECONDS: ${APP_GENERATION_RESULT_ORPHAN_GRACE_SECONDS:-3600}
      APP_GENERATION_RESULT_ORPHAN_BATCH: ${APP_GENERATION_RESULT_ORPHAN_BATCH:-100}
      APP_GENERATION_RESULT_ORPHAN_SCAN_INTERVAL_MS: ${APP_GENERATION_RESULT_ORPHAN_SCAN_INTERVAL_MS:-600000}
      APP_GENERATION_RESULT_CANCEL_LEASE_SECONDS: ${APP_GENERATION_RESULT_CANCEL_LEASE_SECONDS:-30}
      APP_GENERATION_RESULT_CANCEL_BATCH: ${APP_GENERATION_RESULT_CANCEL_BATCH:-10}
      APP_GENERATION_RESULT_CANCEL_SCAN_INTERVAL_MS: ${APP_GENERATION_RESULT_CANCEL_SCAN_INTERVAL_MS:-2000}
      APP_GENERATION_RESULT_CANCEL_MAX_BACKOFF_SECONDS: ${APP_GENERATION_RESULT_CANCEL_MAX_BACKOFF_SECONDS:-300}
      APP_CAMPAIGN_FULFILLMENT_MODE: ${APP_CAMPAIGN_FULFILLMENT_MODE:-stream}
      APP_CAMPAIGN_CONSUMER_ENABLED: ${APP_CAMPAIGN_CONSUMER_ENABLED:-true}
      APP_CAMPAIGN_CONSUMER_BATCH: ${APP_CAMPAIGN_CONSUMER_BATCH:-10}
      APP_CAMPAIGN_CONSUMER_BLOCK_MS: ${APP_CAMPAIGN_CONSUMER_BLOCK_MS:-1000}
      APP_CAMPAIGN_CLAIM_IDLE_MS: ${APP_CAMPAIGN_CLAIM_IDLE_MS:-5000}
      APP_CAMPAIGN_MAX_DELIVERIES: ${APP_CAMPAIGN_MAX_DELIVERIES:-5}
      APP_CAMPAIGN_REQUEST_TTL_SECONDS: ${APP_CAMPAIGN_REQUEST_TTL_SECONDS:-2592000}
      APP_CAMPAIGN_TRIM_ENABLED: ${APP_CAMPAIGN_TRIM_ENABLED:-true}
      APP_CAMPAIGN_TRIM_INTERVAL_MS: ${APP_CAMPAIGN_TRIM_INTERVAL_MS:-60000}
      APP_CAMPAIGN_RECONCILE_ENABLED: ${APP_CAMPAIGN_RECONCILE_ENABLED:-true}
      APP_CAMPAIGN_RECONCILE_INTERVAL_MS: ${APP_CAMPAIGN_RECONCILE_INTERVAL_MS:-60000}
      APP_MEDIA_ROOT: /app/media
      APP_MEDIA_MAX_FILE_BYTES: ${APP_MEDIA_MAX_FILE_BYTES:-5000000}
      APP_MEDIA_USER_BYTE_QUOTA: ${APP_MEDIA_USER_BYTE_QUOTA:-500000000}
      APP_MEDIA_USER_ASSET_QUOTA: ${APP_MEDIA_USER_ASSET_QUOTA:-1000}
      APP_MEDIA_MAX_CREATION_MEDIA: ${APP_MEDIA_MAX_CREATION_MEDIA:-9}
      APP_MEDIA_PENDING_GRACE_SECONDS: ${APP_MEDIA_PENDING_GRACE_SECONDS:-300}
      APP_MEDIA_ORPHAN_GRACE_SECONDS: ${APP_MEDIA_ORPHAN_GRACE_SECONDS:-3600}
      APP_MEDIA_RECONCILE_ENABLED: ${APP_MEDIA_RECONCILE_ENABLED:-true}
      APP_MEDIA_RECONCILE_INTERVAL_MS: ${APP_MEDIA_RECONCILE_INTERVAL_MS:-60000}
      APP_COMMUNITY_SIGNIN_ZONE: ${APP_COMMUNITY_SIGNIN_ZONE:-Asia/Shanghai}
      APP_COMMUNITY_SIGNIN_TTL_SECONDS: ${APP_COMMUNITY_SIGNIN_TTL_SECONDS:-3456000}
      APP_COMMUNITY_FEED_BATCH: ${APP_COMMUNITY_FEED_BATCH:-200}
      APP_COMMUNITY_FEED_PAGE_MAX: ${APP_COMMUNITY_FEED_PAGE_MAX:-50}
      APP_CDC_ENABLED: ${APP_CDC_ENABLED:-true}
      APP_CDC_HOST: canal
      APP_CDC_PORT: '11111'
      APP_CDC_DESTINATION: ${APP_CDC_DESTINATION:?}
      APP_CDC_SCHEMA: ${MYSQL_DATABASE:?}
      APP_CDC_USERNAME: ai_cdc_client
      APP_CDC_PASSWORD: ${CANAL_CLIENT_PASSWORD:?}
      APP_CDC_BATCH_SIZE: ${APP_CDC_BATCH_SIZE:-200}
      APP_CDC_POLL_TIMEOUT_MS: ${APP_CDC_POLL_TIMEOUT_MS:-1000}
      APP_CDC_LEASE_SECONDS: ${APP_CDC_LEASE_SECONDS:-30}
      APP_CDC_RECONNECT_MS: ${APP_CDC_RECONNECT_MS:-1000}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
      APP_DB_USERNAME: ai_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      SCHEMA_DB_USERNAME: ai_schema
      SCHEMA_DB_PASSWORD: ${SCHEMA_DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      APP_CACHE_FALLBACK_CONCURRENCY: ${APP_CACHE_FALLBACK_CONCURRENCY:-4}
      APP_MEMCACHE_ENABLED: ${APP_MEMCACHE_ENABLED:-true}
      APP_MEMCACHE_HOST: memcached
      APP_MEMCACHE_PORT: '11211'
      APP_MEMCACHE_TIMEOUT_MS: '100'
      APP_MESSAGING_TRANSPORT: ${APP_MESSAGING_TRANSPORT:-local}
      APP_MQ_NAMESERVER: mq-nameserver:9876
      APP_MQ_TOPIC: ${APP_MQ_TOPIC:?}
      APP_MQ_GROUP_PREFIX: ${APP_MQ_GROUP_PREFIX:?}
      APP_MESSAGING_RELAY_ENABLED: ${APP_MESSAGING_RELAY_ENABLED:-true}
      APP_MESSAGING_POLL_DELAY_MS: ${APP_MESSAGING_POLL_DELAY_MS:-1000}
      APP_MESSAGING_REDRIVE_SENT_SECONDS: ${APP_MESSAGING_REDRIVE_SENT_SECONDS:-30}
      APP_MESSAGING_RETRY_BASE_SECONDS: ${APP_MESSAGING_RETRY_BASE_SECONDS:-1}
      APP_MESSAGING_MAX_CONSUME_ATTEMPTS: ${APP_MESSAGING_MAX_CONSUME_ATTEMPTS:-5}
      APP_ANALYTICS_ENABLED: ${APP_ANALYTICS_ENABLED:-true}
      APP_ANALYTICS_TOPIC: ${APP_ANALYTICS_TOPIC:?}
      APP_ANALYTICS_GROUP: ${APP_ANALYTICS_GROUP:?}
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_ANALYTICS_SEND_TIMEOUT_MS: ${APP_ANALYTICS_SEND_TIMEOUT_MS:-3000}
      APP_ANALYTICS_VISIT_QUEUE_CAPACITY: ${APP_ANALYTICS_VISIT_QUEUE_CAPACITY:-512}
      APP_ANALYTICS_MAX_SEND_ATTEMPTS: ${APP_ANALYTICS_MAX_SEND_ATTEMPTS:-30}
      APP_ANALYTICS_MAX_RETRY_SECONDS: ${APP_ANALYTICS_MAX_RETRY_SECONDS:-300}
      APP_ANALYTICS_VISIT_ATTEMPTS: ${APP_ANALYTICS_VISIT_ATTEMPTS:-3}
      APP_ANALYTICS_CLIENT_ID: ${APP_ANALYTICS_CLIENT_ID:-ai-creation-analytics}
      APP_ANALYTICS_RELAY_ENABLED: ${APP_ANALYTICS_RELAY_ENABLED:-true}
      APP_ANALYTICS_RELAY_BATCH: ${APP_ANALYTICS_RELAY_BATCH:-50}
      APP_ANALYTICS_LEASE_SECONDS: ${APP_ANALYTICS_LEASE_SECONDS:-30}
      APP_ANALYTICS_POLL_DELAY_MS: ${APP_ANALYTICS_POLL_DELAY_MS:-1000}
      APP_ANALYTICS_SENT_RECOVERY_SECONDS: ${APP_ANALYTICS_SENT_RECOVERY_SECONDS:-60}
      APP_ANALYTICS_SENT_RECOVERY_INTERVAL_MS: ${APP_ANALYTICS_SENT_RECOVERY_INTERVAL_MS:-15000}
      APP_ANALYTICS_CONSUMER_ENABLED: ${APP_ANALYTICS_CONSUMER_ENABLED:-true}
      APP_ANALYTICS_POLL_RECORDS: ${APP_ANALYTICS_POLL_RECORDS:-50}
      APP_ANALYTICS_POLL_TIMEOUT_MS: ${APP_ANALYTICS_POLL_TIMEOUT_MS:-1000}
      APP_ANALYTICS_RETRY_BACKOFF_MS: ${APP_ANALYTICS_RETRY_BACKOFF_MS:-1000}
      APP_ANALYTICS_BACKFILL_ENABLED: ${APP_ANALYTICS_BACKFILL_ENABLED:-true}
      APP_ANALYTICS_BACKFILL_DAYS: ${APP_ANALYTICS_BACKFILL_DAYS:-7}
      APP_ANALYTICS_BACKFILL_BATCH: ${APP_ANALYTICS_BACKFILL_BATCH:-200}
      APP_ANALYTICS_BACKFILL_INTERVAL_MS: ${APP_ANALYTICS_BACKFILL_INTERVAL_MS:-500}
      APP_ANALYTICS_RETENTION_DAYS: ${APP_ANALYTICS_RETENTION_DAYS:-30}
      APP_ANALYTICS_MAX_CLOCK_SKEW_MINUTES: ${APP_ANALYTICS_MAX_CLOCK_SKEW_MINUTES:-5}
      APP_ANALYTICS_CLEANUP_INTERVAL_MS: ${APP_ANALYTICS_CLEANUP_INTERVAL_MS:-3600000}
      APP_ANALYTICS_HEAT_VISIT_WEIGHT: ${APP_ANALYTICS_HEAT_VISIT_WEIGHT:-1}
      APP_ANALYTICS_HEAT_UV_WEIGHT: ${APP_ANALYTICS_HEAT_UV_WEIGHT:-2}
      APP_ANALYTICS_HEAT_ORDER_WEIGHT: ${APP_ANALYTICS_HEAT_ORDER_WEIGHT:-5}
      APP_ANALYTICS_HEAT_PAYMENT_WEIGHT: ${APP_ANALYTICS_HEAT_PAYMENT_WEIGHT:-10}
      APP_ANALYTICS_HEAT_CLAIM_WEIGHT: ${APP_ANALYTICS_HEAT_CLAIM_WEIGHT:-8}
      APP_OPERATIONS_METRICS_INTERVAL_MS: ${APP_OPERATIONS_METRICS_INTERVAL_MS:-15000}
      APP_OPERATIONS_DEPENDENCY_INTERVAL_MS: ${APP_OPERATIONS_DEPENDENCY_INTERVAL_MS:-15000}
      APP_RETENTION_CLEANUP_ENABLED: ${APP_RETENTION_CLEANUP_ENABLED:-true}
      APP_RETENTION_CLEANUP_INTERVAL_MS: ${APP_RETENTION_CLEANUP_INTERVAL_MS:-86400000}
      APP_RETENTION_OUTBOX_DONE_DAYS: ${APP_RETENTION_OUTBOX_DONE_DAYS:-30}
      APP_RETENTION_INBOX_DAYS: ${APP_RETENTION_INBOX_DAYS:-30}
      APP_RETENTION_MESSAGE_FAILURE_DAYS: ${APP_RETENTION_MESSAGE_FAILURE_DAYS:-30}
      APP_RETENTION_ANALYTICS_FAILURE_DAYS: ${APP_RETENTION_ANALYTICS_FAILURE_DAYS:-30}
      APP_RETENTION_AUDIT_DAYS: ${APP_RETENTION_AUDIT_DAYS:-365}
      APP_RETENTION_BATCH_SIZE: ${APP_RETENTION_BATCH_SIZE:-500}
      TZ: UTC
    volumes:
      - media-data:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      memcached:
        condition: service_started
      mq-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      canal:
        condition: service_started
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '3', http://127.0.0.1:8080/actuator/health/readiness]
      interval: 3s
      timeout: 4s
      start_period: 30s
      retries: 30
    logging: *default-logging
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${COMPOSE_PROJECT_NAME:?}-frontend:local
    build:
      context: ..
      dockerfile: deploy/web/next.Dockerfile
    environment:
      API_ORIGIN: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:3000/healthz | grep -q ok']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /app/.next/cache:size=64m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true

  web:
    image: ${COMPOSE_PROJECT_NAME:?}-web:local
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:?}:8080'
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../.local/deploy/${DEPLOY_ENV:?}/monitor-token:/etc/prometheus/monitor-token:ro
      - prometheus-data:/prometheus
    ports:
      - '${MONITOR_BIND:-127.0.0.1}:${PROMETHEUS_PORT:?}:9090'
    depends_on:
      app:
        condition: service_started
      alertmanager:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://127.0.0.1:${ALERTMANAGER_PORT:?}/'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - '${MONITOR_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:?}:9093'
    depends_on:
      alert-receiver:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:9093/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true

  alert-receiver:
    image: ${COMPOSE_PROJECT_NAME:?}-alert-receiver:local
    build:
      context: ./monitoring/receiver
      dockerfile: Dockerfile
    volumes:
      - alert-receiver-log:/var/log/alert-receiver
    ports:
      - '${MONITOR_BIND:-127.0.0.1}:${ALERT_RECEIVER_PORT:?}:8099'
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8099/healthz | grep -q ok']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.2.2@sha256:d5133220d770aba5cb655147b619fa8770b90f41d8489a821d33b1cd34d16f89
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_SERVER_DOMAIN: 127.0.0.1
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:?}/
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '${MONITOR_BIND:-127.0.0.1}:${GRAFANA_PORT:?}:3000'
    depends_on:
      prometheus:
        condition: service_started
    logging: *default-logging
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
  media-data:
  canal-meta:
  kafka-data:
  prometheus-data:
  alertmanager-data:
  alert-receiver-log:
  grafana-data:
