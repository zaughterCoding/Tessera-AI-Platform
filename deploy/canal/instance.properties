# Canal 文件实例配置；启动脚本会从独立本地环境展开 @...@ 占位符。
canal.instance.gtidon=false
canal.instance.master.address=@CANAL_DB_HOST@:@CANAL_DB_PORT@
canal.instance.master.journal.name=
canal.instance.master.position=
canal.instance.master.timestamp=
canal.instance.master.gtid=
canal.instance.multi.stream.on=false
canal.instance.tsdb.enable=true
canal.instance.tsdb.dir=/home/admin/canal-server/conf/@CANAL_DESTINATION@
canal.instance.tsdb.url=jdbc:h2:/home/admin/canal-server/conf/@CANAL_DESTINATION@/h2;CACHE_SIZE=1000;MODE=MYSQL;
canal.instance.tsdb.dbUsername=canal
canal.instance.tsdb.dbPassword=canal
canal.instance.tsdb.snapshot.interval=24
canal.instance.tsdb.snapshot.expire=360
canal.instance.standby.address=
canal.instance.dbUsername=@CANAL_DB_USERNAME@
canal.instance.dbPassword=@CANAL_DB_PASSWORD@
canal.instance.connectionCharset=UTF-8
canal.instance.enableDruid=false
canal.instance.mysql.slaveId=@CANAL_SLAVE_ID@
# MySQL 必须使用 ROW + FULL 行镜像；UPDATE/DELETE 需要 before/after 两份镜像。
canal.instance.filter.regex=@CANAL_SCHEMA@\\.(ai_application|usage_product)
canal.instance.filter.black.regex=mysql\\.slave_.*
canal.instance.filter.rows=false
canal.instance.filter.druid.ddl=false
canal.instance.filter.transaction.entry=false
