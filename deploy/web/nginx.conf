worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  charset utf-8;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  client_header_timeout 10s;
  client_body_timeout 20s;
  send_timeout 20s;
  client_max_body_size 6m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                  'rt=$request_time ur=$upstream_response_time rid=$request_id';
  access_log /dev/stdout main;

  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  upstream app_backend {
    server app:8080;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # 默认保护：监控、运维与后端内部路径不经过唯一入口暴露。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # 静态资源不使用强缓存；下架、删除和发布以服务端实时结果为准。
    expires -1;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /actuator {
      return 404;
    }

    location ^~ /actuator/ {
      return 404;
    }

    location = /media {
      return 404;
    }

    location ^~ /media/ {
      return 404;
    }

    # 裸 /api 不做重定向，避免路径变体绕过前缀判断。
    location = /api {
      return 404;
    }

    # 监控端点和其路径变体一律在入口拒绝；应用内部仍有独立的鉴权兜底。
    location ^~ /api/actuator {
      return 404;
    }

    if ($request_uri ~* "^/api(?:/|%2f|%5c)+.*actuator") {
      return 404;
    }

    location ^~ /api/ {
      expires off;
      proxy_pass http://app_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_request_buffering on;
      proxy_buffering on;
      proxy_cache_bypass 1;
      proxy_no_cache 1;
    }

    location ^~ /assets/ {
      try_files $uri =404;
    }

    location ^~ /scripts/ {
      try_files $uri =404;
    }

    location ^~ /vendor/ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
