worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  charset utf-8;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  client_header_timeout 10s;
  client_body_timeout 20s;
  send_timeout 20s;
  client_max_body_size 6m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                  'rt=$request_time ur=$upstream_response_time rid=$request_id';
  access_log /dev/stdout main;

  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  upstream app_backend {
    server app:8080;
    keepalive 16;
  }

  upstream web_frontend {
    server frontend:3000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    # 默认保护；页面的 CSP 由前端按请求生成 nonce，这里不再下发。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # 保留端口，前端校验写请求来源时要和 Origin 比较。
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 35s;
    proxy_cache_bypass 1;
    proxy_no_cache 1;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok
";
    }

    # 监控端点和路径变体一律在入口拒绝；应用内部仍有独立的鉴权兜底。
    location = /actuator {
      return 404;
    }

    location ^~ /actuator/ {
      return 404;
    }

    location ^~ /api/actuator {
      return 404;
    }

    if ($request_uri ~* "^/api(?:/|%2f|%5c)+.*actuator") {
      return 404;
    }

    # 上游回调不依赖用户会话，凭签名校验，直达后端。
    location = /api/generation/provider/callback {
      proxy_pass http://app_backend/generation/provider/callback;
    }

    # 页面和接口都交给前端；接口由前端附加会话后转发到后端。
    location / {
      proxy_pass http://web_frontend;
      proxy_request_buffering on;
      proxy_buffering on;
    }
  }
}
